# Déploiement Coolify : router le domaine vers le service `proxy`, port 80.
# PostgreSQL n'est pas dans cette pile : DATABASE_URL pointe vers une base existante.
name: become-top-dev

services:
  # Construit seulement l'image d'exécution Go utilisée par le runner, puis s'arrête.
  sandbox-go:
    build: ./sandbox/images/go
    image: btd-runner-go
    command: ["true"]
    restart: "no"

  sandbox-groovy:
    build: ./sandbox/images/groovy
    image: btd-runner-groovy
    command: ["true"]
    restart: "no"

  runner:
    build: ./runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?définir RUNNER_TOKEN}
      RUNNER_IMAGES: '{"go": "btd-runner-go", "groovy": "btd-runner-groovy"}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-go:
        condition: service_completed_successfully
      sandbox-groovy:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Base PostgreSQL externe (instance Coolify existante), ex. postgres://btd:…@hôte:5432/btd?sslmode=require
      BTD_DATABASE_URL: ${DATABASE_URL:?définir DATABASE_URL}
      # Compte administrateur, créé au premier démarrage puis ignoré (mot de passe modifiable dans l'app).
      BTD_ADMIN_EMAIL: ${ADMIN_EMAIL:?définir ADMIN_EMAIL}
      BTD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?définir ADMIN_PASSWORD}
      BTD_SECURE_COOKIES: ${SECURE_COOKIES:-true}
      BTD_RUNNER_URL: http://runner:8001
      BTD_RUNNER_TOKEN: ${RUNNER_TOKEN}
    depends_on:
      runner:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Rendu serveur : le frontend interroge le backend en direct, en relayant le cookie de session.
      BTD_API_URL: http://backend:8000
    restart: unless-stopped

  proxy:
    build: ./deploy
    expose:
      - "80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
