milestones:
  - id: m1
    title: "Lire une taille"
    goal: "Convertir « 512 », « 10KB » ou « 1.5MiB » en octets avec des entiers uniquement, refuser les fractions d'octet et détecter les dépassements d'int64."
    tests: "go test ./... -run TestM1"
    review: false
  - id: m2
    title: "Afficher une taille"
    goal: "Choisir l'unité binaire la plus grande possible et afficher une décimale tronquée, jusqu'à l'exaoctet et pour les valeurs négatives."
    tests: "go test ./... -run TestM2"
    review: false
  - id: m3
    title: "Surveiller un quota"
    goal: "Calculer un pourcentage sans NaN ni division entière, puis classer l'usage en ok, warn, full ou unlimited."
    tests: "go test ./... -run TestM3"
    review: true
