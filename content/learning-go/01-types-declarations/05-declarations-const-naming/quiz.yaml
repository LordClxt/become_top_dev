id: go-ch01-l05-quiz
questions:
  - id: q1
    type: single
    prompt: "Quelle déclaration indique le plus clairement que la valeur zéro est voulue ?"
    choices: ["total := 0", "var total int", "var total = 0", "total := int(0)"]
    answer: 1
    explanation: "var total int dit « zéro » sans ambiguïté : aucune valeur n'est écrite parce que la valeur zéro est celle qu'on veut."
    concept: go-var-vs-short
    difficulty: 1
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := 10
      x, y := 30, "hello"
      fmt.Println(x, y)
    answer: "30 hello"
    explanation: "Comme y est nouvelle, := est autorisé : x est simplement réaffectée à 30."
    concept: go-var-vs-short
    difficulty: 1
  - id: q3
    type: single
    prompt: "Peut-on écrire `count := 0` en dehors de toute fonction ?"
    choices: ["Oui", "Non : au niveau du package, il faut var", "Seulement dans main.go", "Oui, si count est exporté"]
    answer: 1
    explanation: ":= n'est légal qu'à l'intérieur d'une fonction."
    concept: go-var-vs-short
    difficulty: 1
  - id: q4
    type: single
    prompt: "Pourquoi ce code ne compile-t-il pas ?\n\nx := 5\ny := 10\nconst z = x + y"
    choices:
      - "Parce que const ne peut pas contenir d'addition"
      - "Parce que x + y est calculé à l'exécution, donc n'est pas une constante"
      - "Parce que z doit être déclaré avec var"
      - "Parce que x et y sont des entiers"
    answer: 1
    explanation: "Une constante doit être calculable à la compilation. x et y sont des variables, leur somme ne l'est donc pas."
    concept: go-const
    difficulty: 2
  - id: q5
    type: single
    prompt: "Avec `const typed int = 10`, laquelle de ces lignes ne compile pas ?"
    choices: ["var a int = typed", "var b float64 = typed", "var c = typed", "fmt.Println(typed)"]
    answer: 1
    explanation: "Une constante typée ne s'affecte qu'à son type. Non typée (const untyped = 10), elle aurait été acceptée par float64."
    concept: go-const
    difficulty: 2
  - id: q6
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      const unused = 42
      x := 1
      fmt.Println(x)
    answer: "1"
    explanation: "Une constante inutilisée n'est pas une erreur : elle ne laisse aucune trace dans le binaire."
    concept: go-unused
    difficulty: 1
  - id: q7
    type: single
    prompt: "Que fait le compilateur avec `x := 10` dans une fonction si x n'est jamais lu ?"
    choices:
      - "Il l'accepte et supprime x"
      - "Il refuse : declared and not used"
      - "Il affiche un avertissement seulement"
      - "Il initialise x à zéro"
    answer: 1
    explanation: "Toute variable locale doit être lue au moins une fois. En revanche, une affectation jamais lue après une première lecture passe inaperçue."
    concept: go-unused
    difficulty: 1
  - id: q8
    type: code-output
    prompt: "Qu'affiche ce programme ? (le premier identifiant est un « a » pleine largeur, U+FF41)"
    code: |
      ａ := "hello"
      a := "goodbye"
      fmt.Println(ａ, a)
    answer: "hello goodbye"
    explanation: "ａ (U+FF41) et a (U+0061) sont deux identifiants différents, mais indiscernables à l'écran. C'est pourquoi on écrit ses identifiants en ASCII."
    concept: go-naming
    difficulty: 2
  - id: q9
    type: multiple
    prompt: "Lesquels de ces noms sont idiomatiques en Go ?"
    choices: ["indexCounter", "MAX_SIZE", "maxSize", "user_name", "i (dans une petite boucle)"]
    answer: [0, 2, 4]
    explanation: "Go utilise le camelCase, pas le snake_case ni les constantes en MAJUSCULES. Un nom très court est normal dans un petit scope."
    concept: go-naming
    difficulty: 1
  - id: q10
    type: single
    prompt: "Quelle écriture est idiomatique pour un byte valant 20 ?"
    choices: ["x := byte(20)", "var x byte = 20", "x := 20", "var x = byte(20)"]
    answer: 1
    explanation: "Quand le type voulu n'est pas le type par défaut du littéral, on utilise la forme longue var avec le type."
    concept: go-var-vs-short
    difficulty: 2
