cards:
  - id: fc1
    front: "Quand préférer var à := dans une fonction ?"
    back: "Pour la valeur zéro, pour un type différent du type par défaut du littéral, et pour éviter de créer une variable fantôme par erreur."
    concept: go-var-vs-short
  - id: fc2
    front: "Quelle condition rend x, y := 30, \"hello\" légal si x existe déjà ?"
    back: "Au moins une variable à gauche doit être nouvelle (ici y)."
    concept: go-var-vs-short
  - id: fc3
    front: "Où := est-il interdit ?"
    back: "Hors d'une fonction, au niveau du package."
    concept: go-var-vs-short
  - id: fc4
    front: "Que peut contenir une const ?"
    back: "Des valeurs calculables à la compilation : littéraux, true/false, runes, strings, len/cap sur des tableaux, expressions de ces valeurs."
    concept: go-const
  - id: fc5
    front: "Go a-t-il un moyen de rendre immuable une valeur calculée à l'exécution ?"
    back: "Non. const n'est qu'un nom pour un littéral."
    concept: go-const
  - id: fc6
    front: "Constante typée ou non typée par défaut ?"
    back: "Non typée : elle s'adapte à son contexte. On la type quand elle doit imposer un type."
    concept: go-const
  - id: fc7
    front: "Une variable locale jamais lue : que se passe-t-il ?"
    back: "Erreur de compilation : declared and not used."
    concept: go-unused
  - id: fc8
    front: "Une constante jamais utilisée : que se passe-t-il ?"
    back: "Rien : elle est simplement absente du binaire."
    concept: go-unused
  - id: fc9
    front: "Quelle convention pour les noms de plusieurs mots, et pour les constantes ?"
    back: "camelCase (indexCounter) ; pas de snake_case, pas de MAJUSCULES pour les constantes."
    concept: go-naming
  - id: fc10
    front: "Pourquoi éviter les identifiants non ASCII ?"
    back: "Des caractères qui se ressemblent (a et ａ) donnent deux variables différentes, indiscernables à l'écran."
    concept: go-naming
