id: go-ch01-l03-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      a, b := 0.1, 0.2
      fmt.Println(a+b == 0.3, a+b)
    answer: "false 0.30000000000000004"
    explanation: "0.1 et 0.2 sont des approximations binaires ; leur somme est légèrement supérieure à l'approximation de 0.3. La comparaison avec == échoue."
    concept: go-float-precision
    difficulty: 2
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      var z float64
      fmt.Println(1/z, -1/z, z/z)
    answer: "+Inf -Inf NaN"
    explanation: "Pour les flottants, diviser par zéro ne panique pas : on obtient ±Inf, et 0/0 donne NaN."
    concept: go-float-precision
    difficulty: 2
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      nan := math.NaN()
      fmt.Println(nan == nan, nan != nan)
    answer: "false true"
    explanation: "NaN n'est égal à aucune valeur, lui-même compris. Pour le détecter, on utilise math.IsNaN."
    concept: go-float-compare
    difficulty: 2
  - id: q4
    type: single
    prompt: "Pourquoi ne faut-il pas stocker un prix en float64 ?"
    choices:
      - "Parce que float64 est trop lent"
      - "Parce qu'un flottant ne représente pas exactement des valeurs décimales comme 0,10"
      - "Parce que float64 ne gère pas les nombres négatifs"
      - "Parce que Go interdit les virgules"
    answer: 1
    explanation: "Les flottants stockent des approximations binaires. Pour l'argent, on utilise des entiers (centimes) ou une bibliothèque décimale."
    concept: go-float-precision
    difficulty: 1
  - id: q5
    type: single
    prompt: "Quelle est la bonne façon de comparer deux flottants a et b ?"
    choices:
      - "a == b"
      - "math.Abs(a-b) <= epsilon"
      - "a - b == 0"
      - "int(a) == int(b)"
    answer: 1
    explanation: "On compare la distance à une tolérance adaptée au besoin."
    concept: go-float-compare
    difficulty: 1
  - id: q6
    type: single
    prompt: "Lequel de ces opérateurs n'existe pas pour float64 ?"
    choices: ["+", "/", "%", "<="]
    answer: 2
    explanation: "Le reste % n'est défini que pour les entiers. Pour un flottant, on utilise math.Mod."
    concept: go-float-precision
    difficulty: 1
  - id: q7
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      s := "héllo"
      fmt.Println(len(s), s == "héllo", s < "hz")
    answer: "6 true false"
    explanation: "len compte les octets : é en prend deux, donc 6. Les strings se comparent octet par octet : l'octet de tête de é (0xC3) est supérieur à celui de z (0x7A), donc s n'est pas inférieur à \"hz\"."
    concept: go-string-rune-basics
    difficulty: 3
  - id: q8
    type: multiple
    prompt: "Quelles opérations sont valides sur deux strings a et b ?"
    choices: ["a == b", "a < b", "a + b", "a - b", "a % b"]
    answer: [0, 1, 2]
    explanation: "Les strings se comparent et se concatènent. Il n'y a ni soustraction ni reste."
    concept: go-string-rune-basics
    difficulty: 1
  - id: q9
    type: single
    prompt: "Quel est le bon type pour stocker le caractère 'J' ?"
    choices: ["string", "byte", "rune", "int8"]
    answer: 2
    explanation: "rune (alias de int32) désigne un point de code Unicode : c'est le type qui exprime l'intention « un caractère »."
    concept: go-string-rune-basics
    difficulty: 1
