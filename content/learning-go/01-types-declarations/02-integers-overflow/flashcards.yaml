cards:
  - id: fc1
    front: "byte et rune : alias de quoi ?"
    back: "byte = uint8, rune = int32."
    concept: go-int-types
  - id: fc2
    front: "Quel type entier choisir par défaut ?"
    back: "int. On prend une taille fixe seulement si un format ou un protocole l'impose."
    concept: go-int-types
  - id: fc3
    front: "Pourquoi éviter uint pour une longueur ?"
    back: "Parce que len(x) - 1 sur une collection vide donne un énorme nombre au lieu de -1."
    concept: go-int-types
  - id: fc4
    front: "Vers où la division entière arrondit-elle ?"
    back: "Vers zéro : -7 / 2 vaut -3."
    concept: go-int-division
  - id: fc5
    front: "Quel est le signe de -7 % 2 ?"
    back: "Négatif : -1. Le reste prend le signe du dividende."
    concept: go-int-division
  - id: fc6
    front: "Que fait a / 0 pour deux variables int ?"
    back: "Un panic à l'exécution. (Une constante nulle est refusée à la compilation.)"
    concept: go-int-division
  - id: fc7
    front: "Que calcule x &^ mask ?"
    back: "x avec les bits de mask mis à zéro (« ET NON »)."
    concept: go-bit-ops
  - id: fc8
    front: "Combien font var b byte = 255; b++ ?"
    back: "0 : le calcul fait le tour, sans erreur ni panic."
    concept: go-int-overflow
  - id: fc9
    front: "Comment détecter un débordement d'addition signée ?"
    back: "Deux opérandes de même signe et un résultat de signe opposé."
    concept: go-int-overflow
  - id: fc10
    front: "var b byte = 256 compile-t-il ?"
    back: "Non : une constante hors plage est une erreur de compilation. Seul le calcul à l'exécution déborde en silence."
    concept: go-int-overflow
