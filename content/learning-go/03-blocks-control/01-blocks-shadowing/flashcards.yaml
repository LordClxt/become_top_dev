cards:
  - id: fc1
    front: "Quels sont les blocs de Go, du plus large au plus étroit ?"
    back: "Univers, package, fichier, fonction, puis chaque paire d'accolades."
    concept: go-blocks
  - id: fc2
    front: "Depuis un bloc interne, que voit-on ?"
    back: "Tous les identifiants des blocs englobants. Jamais ceux d'un bloc interne, qui disparaissent à l'accolade fermante."
    concept: go-blocks
  - id: fc3
    front: "Qu'est-ce que le shadowing ?"
    back: "Déclarer dans un bloc interne un nom déjà utilisé dans un bloc englobant : la nouvelle variable masque l'ancienne jusqu'à la fin du bloc."
    concept: go-shadowing
  - id: fc4
    front: "x := 5 ou x = 5 pour modifier un x déclaré plus haut ?"
    back: "x = 5. Avec :=, on crée une nouvelle variable qui masque l'ancienne."
    concept: go-shadowing
  - id: fc5
    front: "x, y := 5, 20 dans un if réutilise-t-il le x de la fonction ?"
    back: "Non : := ne réutilise que les variables du bloc courant. x est masqué, pas modifié."
    concept: go-shadowing
  - id: fc6
    front: "Que se passe-t-il si une variable locale s'appelle fmt ?"
    back: "Elle masque le package fmt pour la suite de la fonction : fmt.Println ne compile plus."
    concept: go-shadowing
  - id: fc7
    front: "true, nil, len, int : mots-clés ou identifiants ?"
    back: "Identifiants prédéclarés du bloc univers : ils se masquent comme n'importe quel nom. À ne jamais faire."
    concept: go-universe-block
  - id: fc8
    front: "go vet signale-t-il le shadowing ?"
    back: "Non, car il est parfois voulu. Des analyseurs comme x/tools shadow ou golangci-lint le détectent."
    concept: go-universe-block
