id: go-ch03-l01-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := 10
      if x > 5 {
      	fmt.Println(x)
      	x := 5
      	fmt.Println(x)
      }
      fmt.Println(x)
    answer: "10\n5\n10"
    explanation: "Le premier Println voit encore le x extérieur (10). Après x := 5, un nouveau x masque l'ancien (5). À la fermeture de l'accolade le x intérieur disparaît : l'extérieur vaut toujours 10."
    concept: go-shadowing
    difficulty: 2
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := 10
      if x > 5 {
      	x = 5
      	fmt.Println(x)
      }
      fmt.Println(x)
    answer: "5\n5"
    explanation: "Avec = (et non :=), on modifie le x extérieur : aucune nouvelle variable n'est créée."
    concept: go-shadowing
    difficulty: 1
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := 10
      if x > 5 {
      	x, y := 5, 20
      	fmt.Println(x, y)
      }
      fmt.Println(x)
    answer: "5 20\n10"
    explanation: ":= ne réutilise que les variables du bloc courant. Ici x et y sont toutes les deux nouvelles dans le bloc du if : le x extérieur est masqué, pas modifié."
    concept: go-shadowing
    difficulty: 2
  - id: q4
    type: single
    prompt: "Ce code compile-t-il ?\n\nif n := len(os.Args); n > 1 {\n    fmt.Println(\"args\")\n}\nfmt.Println(n)"
    choices:
      - "Oui, n est visible partout dans la fonction"
      - "Non : n n'existe que dans le if et ses else"
      - "Oui, mais n vaut 0 après le if"
      - "Non : on ne peut pas déclarer de variable dans un if"
    answer: 1
    explanation: "Une variable déclarée dans l'initialisation d'un if est locale à ce if (et à ses else). Après l'accolade finale, elle n'existe plus."
    concept: go-blocks
    difficulty: 1
  - id: q5
    type: single
    prompt: "Pourquoi ce code ne compile-t-il pas ?\n\nfmt := \"oops\"\nfmt.Println(fmt)"
    choices:
      - "fmt est un mot-clé réservé"
      - "La variable locale fmt masque le package fmt, qui n'a pas de méthode Println"
      - "Il manque un import"
      - "Println n'existe pas"
    answer: 1
    explanation: "Les packages importés sont dans le bloc du fichier. Une variable locale du même nom les masque pour le reste de la fonction."
    concept: go-shadowing
    difficulty: 2
  - id: q6
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      fmt.Println(true)
      true := 10
      fmt.Println(true)
    answer: "true\n10"
    explanation: "true n'est pas un mot-clé mais un identifiant du bloc univers : une déclaration locale le masque. C'est légal, et à ne jamais faire."
    concept: go-universe-block
    difficulty: 2
  - id: q7
    type: multiple
    prompt: "Lesquels de ces mots sont des mots-clés (et ne peuvent donc pas être masqués) ?"
    choices: ["if", "nil", "for", "string", "len", "switch"]
    answer: [0, 2, 5]
    explanation: "if, for et switch sont des mots-clés. nil, string et len sont des identifiants prédéclarés du bloc univers, que l'on peut (mais ne doit pas) masquer."
    concept: go-universe-block
    difficulty: 2
  - id: q8
    type: single
    prompt: "Quel bloc est le plus extérieur, contenant tous les autres ?"
    choices: ["Le bloc du package", "Le bloc du fichier", "Le bloc univers", "Le bloc de main"]
    answer: 2
    explanation: "Le bloc univers contient les identifiants prédéclarés (int, true, nil, len…) et englobe le package, qui englobe le fichier, la fonction, etc."
    concept: go-blocks
    difficulty: 1
