id: go-ch03-l02-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      for i := 0; i < 3; i++ {
      	if i == 1 {
      		continue
      	}
      	fmt.Println(i)
      }
    answer: "0\n2"
    explanation: "Quand i vaut 1, continue saute le reste du corps et passe directement au tour suivant."
    concept: go-break-continue
    difficulty: 1
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      i := 1
      for i < 100 {
      	i *= 2
      }
      fmt.Println(i)
    answer: "128"
    explanation: "i prend les valeurs 1, 2, 4, …, 64, 128. À 128 la condition i < 100 est fausse : la boucle s'arrête."
    concept: go-for-forms
    difficulty: 1
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      n := 10
      for {
      	fmt.Println(n)
      	n--
      	if n < 10 {
      		break
      	}
      }
    answer: "10"
    explanation: "Le corps s'exécute avant le test de sortie : c'est l'équivalent Go du do-while. Il s'exécute donc au moins une fois."
    concept: go-break-continue
    difficulty: 2
  - id: q4
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      if n := 7; n%2 == 0 {
      	fmt.Println("pair", n)
      } else {
      	fmt.Println("impair", n)
      }
    answer: "impair 7"
    explanation: "La variable déclarée dans l'initialisation du if est visible dans la condition, dans le corps et dans toutes les branches else."
    concept: go-if-scoped
    difficulty: 1
  - id: q5
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      for i := 0; i < 10; {
      	if i%2 == 0 {
      		i++
      	} else {
      		i += 2
      	}
      	fmt.Print(i, " ")
      }
    answer: "1 3 5 7 9 11"
    explanation: "L'incrément est décidé dans le corps : pair → +1, impair → +2. La séquence est 1, 3, 5, 7, 9, 11 ; à 11 la condition i < 10 est fausse."
    concept: go-for-forms
    difficulty: 3
  - id: q6
    type: code-output
    prompt: "Qu'affiche ce programme ? (Go 1.22 ou plus)"
    code: |
      for i := range 3 {
      	fmt.Print(i)
      }
    answer: "012"
    explanation: "Depuis Go 1.22, range sur un entier n parcourt 0, 1, …, n-1."
    concept: go-for-forms
    difficulty: 1
  - id: q7
    type: single
    prompt: "Combien de mots-clés de boucle Go possède-t-il ?"
    choices: ["Un : for", "Deux : for et while", "Trois : for, while et do", "Quatre : for, while, do et foreach"]
    answer: 0
    explanation: "Go n'a que for. Il le décline en quatre formes (complète, condition seule, infinie, range)."
    concept: go-for-forms
    difficulty: 1
  - id: q8
    type: single
    prompt: "Quelle initialisation est légale dans une boucle for complète ?"
    choices: ["for var i = 0; i < 3; i++ {", "for i := 0; i < 3; i++ {", "for int i = 0; i < 3; i++ {", "for (i := 0; i < 3; i++) {"]
    answer: 1
    explanation: "Seule la forme courte := est autorisée dans l'initialisation du for, et il n'y a pas de parenthèses."
    concept: go-for-forms
    difficulty: 1
  - id: q9
    type: single
    prompt: "Pourquoi remplacer des if/else imbriqués par une série de if + continue ?"
    choices:
      - "Parce que c'est plus rapide à l'exécution"
      - "Parce que le code reste aligné à gauche et que chaque cas se lit seul"
      - "Parce que else est interdit dans une boucle"
      - "Parce que continue libère la mémoire"
    answer: 1
    explanation: "C'est une question de lisibilité : Go favorise les corps courts et peu imbriqués."
    concept: go-break-continue
    difficulty: 1
