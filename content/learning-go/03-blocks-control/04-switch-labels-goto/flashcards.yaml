cards:
  - id: fc1
    front: "Un case de switch tombe-t-il dans le suivant ?"
    back: "Non. Il faut écrire fallthrough explicitement (et c'est rarement une bonne idée)."
    concept: go-switch
  - id: fc2
    front: "Comment regrouper plusieurs valeurs dans un case ?"
    back: "Avec des virgules : case 1, 2, 3:."
    concept: go-switch
  - id: fc3
    front: "Que fait un case vide ?"
    back: "Rien. Il ne tombe pas dans le case suivant."
    concept: go-switch
  - id: fc4
    front: "Sur quels types peut-on faire un switch ?"
    back: "Tous les types comparables avec == : pas les slices, maps ni fonctions."
    concept: go-switch
  - id: fc5
    front: "Que fait break dans un case d'un switch placé dans un for ?"
    back: "Il quitte le switch, pas la boucle. Pour quitter la boucle : un label et break label."
    concept: go-labels
  - id: fc6
    front: "À quoi sert continue label ?"
    back: "À passer au tour suivant de la boucle nommée, en abandonnant l'élément extérieur en cours."
    concept: go-labels
  - id: fc7
    front: "Qu'est-ce qu'un switch sans expression ?"
    back: "Un switch où chaque case est une condition booléenne. C'est une chaîne de if/else if mieux alignée."
    concept: go-blank-switch
  - id: fc8
    front: "Quand utiliser if plutôt que switch ?"
    back: "Pour des tests indépendants. Le switch signale que les cas forment un ensemble lié."
    concept: go-blank-switch
  - id: fc9
    front: "Quelles règles limitent goto ?"
    back: "Pas de saut par-dessus une déclaration de variable, pas de saut vers l'intérieur d'un bloc."
    concept: go-goto
  - id: fc10
    front: "Quel est le seul bon usage de goto ?"
    back: "Faire passer plusieurs sorties anticipées par un même bloc de fin, quand ni drapeau ni code dupliqué ne conviennent."
    concept: go-goto
