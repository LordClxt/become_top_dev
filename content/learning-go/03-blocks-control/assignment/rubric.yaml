criteria:
  - id: correctness
    label: "Correction (tests)"
    weight: 0.5
    source: tests
  - id: control-flow
    label: "Choix du contrôle de flux"
    weight: 0.2
    source: ai
    levels:
      4: "switch avec valeurs regroupées pour les niveaux, continue pour les lignes ignorées, sortie propre sur --END-- (label ou fonction dédiée), aucun drapeau booléen"
      2: "Correct mais des if/else imbriqués, ou un drapeau booléen pour sortir de la boucle"
      0: "Logique difficile à suivre ou duplication importante"
  - id: determinism
    label: "Maps et déterminisme"
    weight: 0.15
    source: ai
    levels:
      4: "Ensemble des sources dans une map, résultat trié proprement (slices.Sorted / maps.Keys ou équivalent), Counts jamais nil"
      2: "Résultat correct mais tri manuel verbeux, ou Counts parfois nil"
      0: "Ordre non déterministe ou doublons"
  - id: readability
    label: "Lisibilité et style Go"
    weight: 0.15
    source: ai
    levels:
      4: "Noms clairs, fonctions courtes (extraction d'un helper si utile), pas de portée trop large, shadowing évité"
      2: "Lisible mais une grosse fonction ou des variables à portée inutilement large"
      0: "Difficile à suivre"
