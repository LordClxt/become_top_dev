cards:
  - id: fc1
    front: "Quand s'exécute un appel différé avec defer ?"
    back: "À la sortie de la fonction englobante (return, fin ou panique), pas à la fin du bloc."
    concept: go-defer-basics
  - id: fc2
    front: "Dans quel ordre s'exécutent plusieurs defer ?"
    back: "En ordre inverse de leur enregistrement (LIFO)."
    concept: go-defer-basics
  - id: fc3
    front: "Quand les arguments d'un defer sont-ils évalués ?"
    back: "Immédiatement, au moment du defer : leur valeur est figée jusqu'à l'exécution différée."
    concept: go-defer-args
  - id: fc4
    front: "Pourquoi écrire defer func() { … }() avec des parenthèses finales ?"
    back: "defer attend un appel de fonction. Les parenthèses l'appellent et permettent de lui passer des arguments."
    concept: go-defer-args
  - id: fc5
    front: "Un defer peut-il modifier la valeur renvoyée par la fonction ?"
    back: "Oui, si le retour est nommé : le defer s'exécute après le return et peut changer la variable."
    concept: go-defer-named-return
  - id: fc6
    front: "Que fait return n si la fonction n'a pas de retour nommé ?"
    back: "Il copie n dans la valeur de retour avant les defer : les modifications ultérieures de n ne comptent pas."
    concept: go-defer-named-return
  - id: fc7
    front: "Que se passe-t-il avec un defer dans une boucle ?"
    back: "Les appels s'accumulent jusqu'à la fin de la fonction, pas de l'itération. Extrais le corps dans une fonction pour libérer à chaque tour."
    concept: go-defer-basics
  - id: fc8
    front: "Quel est le motif « ressource + nettoyage » ?"
    back: "Une fonction renvoie la ressource et une fonction de nettoyage ; l'appelant fait defer closer(). Il ne peut pas l'oublier, sinon variable inutilisée."
    concept: go-closer-pattern
  - id: fc9
    front: "Pourquoi defer est-il préféré à try/finally ?"
    back: "Il évite un niveau d'indentation par ressource : le nettoyage reste à plat sous l'acquisition."
    concept: go-closer-pattern
