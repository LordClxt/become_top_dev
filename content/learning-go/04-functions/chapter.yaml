id: go-ch04
title: "Fonctions"
subtitle: "Retours multiples, variadiques, closures, defer et passage par valeur : tout ce que Go fait des fonctions"
source: { chapter: 5, pages: "117-142" }
objectives:
  - "Déclarer des fonctions avec plusieurs retours, un paramètre variadique ou une struct d'options, et suivre la convention de l'erreur en dernier"
  - "Expliquer pourquoi les retours nommés servent surtout à defer, et pourquoi le retour nu est à éviter"
  - "Utiliser les fonctions comme valeurs : variables, tables de fonctions, types fonction et fonctions anonymes"
  - "Écrire et raisonner sur des closures qui capturent et modifient leur environnement, les passer et les renvoyer"
  - "Libérer des ressources avec defer en connaissant l'ordre LIFO, l'évaluation immédiate des arguments et l'interaction avec les retours nommés"
  - "Prédire ce que voit l'appelant après un appel, selon que l'on passe un entier, une struct, une map ou une slice"
mastery_threshold: 0.8
prerequisites: [go-ch03]
lessons:
  - "01-declaring-multiple-returns"
  - "02-functions-as-values"
  - "03-closures"
  - "04-defer"
  - "05-call-by-value"
