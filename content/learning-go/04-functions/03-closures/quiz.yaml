id: go-ch04-l03-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      a := 20
      f := func() {
      	fmt.Println(a)
      	a = 30
      }
      f()
      fmt.Println(a)
    answer: "20\n30"
    explanation: "La closure lit puis modifie la variable a de la fonction extérieure : le second Println voit 30."
    concept: go-closure-capture
    difficulty: 1
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      a := 20
      f := func() {
      	fmt.Println(a)
      	a := 30
      	fmt.Println(a)
      }
      f()
      fmt.Println(a)
    answer: "20\n30\n20"
    explanation: "a := 30 crée une nouvelle variable locale à la closure, qui masque a. La variable extérieure n'est pas modifiée."
    concept: go-closure-capture
    difficulty: 2
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      makeMult := func(base int) func(int) int {
      	return func(factor int) int {
      		return base * factor
      	}
      }
      two, three := makeMult(2), makeMult(3)
      for i := 0; i < 3; i++ {
      	fmt.Print(two(i), ",", three(i), " ")
      }
    answer: "0,0 2,3 4,6"
    explanation: "Chaque appel de makeMult crée un environnement distinct : two retient base = 2, three retient base = 3."
    concept: go-func-return
    difficulty: 1
  - id: q4
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      counter := func() func() int {
      	n := 0
      	return func() int {
      		n++
      		return n
      	}
      }
      a, b := counter(), counter()
      fmt.Println(a(), a(), a(), b())
    answer: "1 2 3 1"
    explanation: "Chaque compteur a son propre n, qui persiste entre les appels de sa closure : a compte 1, 2, 3 et b repart de 1."
    concept: go-closure-state
    difficulty: 2
  - id: q5
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      xs := []string{"banana", "kiwi", "apple"}
      sort.Slice(xs, func(i, j int) bool {
      	return len(xs[i]) < len(xs[j])
      })
      fmt.Println(xs)
    answer: "[kiwi apple banana]"
    explanation: "La closure capture xs et compare les longueurs : kiwi (4), apple (5), banana (6)."
    concept: go-func-param
    difficulty: 1
  - id: q6
    type: code-output
    prompt: "Qu'affiche ce programme ? (Go 1.22 ou plus)"
    code: |
      var fs []func() int
      for i := 0; i < 3; i++ {
      	fs = append(fs, func() int { return i * i })
      }
      for _, f := range fs {
      	fmt.Print(f(), " ")
      }
    answer: "0 1 4"
    explanation: "Chaque tour de boucle a sa propre variable i depuis Go 1.22 : chaque closure capture donc une valeur différente. Avant, toutes auraient affiché 4."
    concept: go-closure-capture
    difficulty: 3
  - id: q7
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := 1
      inc := func() { x++ }
      inc()
      inc()
      fmt.Println(x)
    answer: "3"
    explanation: "La closure modifie la variable x de la fonction extérieure : elle ne travaille pas sur une copie."
    concept: go-closure-capture
    difficulty: 1
  - id: q8
    type: single
    prompt: "Qu'est-ce qu'une fonction d'ordre supérieur ?"
    choices:
      - "Une fonction exportée"
      - "Une fonction qui prend une fonction en paramètre ou en renvoie une"
      - "Une fonction récursive"
      - "Une fonction qui s'exécute en premier"
    answer: 1
    explanation: "sort.Slice (qui reçoit une fonction) et makeMult (qui en renvoie une) sont deux fonctions d'ordre supérieur."
    concept: go-func-param
    difficulty: 1
  - id: q9
    type: single
    prompt: "Que signifie qu'une closure « capture » une variable ?"
    choices:
      - "Elle en fait une copie au moment de sa création"
      - "Elle garde une référence à la variable extérieure, qu'elle peut lire et modifier"
      - "Elle la supprime de la fonction extérieure"
      - "Elle la rend constante"
    answer: 1
    explanation: "La capture se fait par référence : closure et fonction extérieure partagent la même variable."
    concept: go-closure-capture
    difficulty: 1
