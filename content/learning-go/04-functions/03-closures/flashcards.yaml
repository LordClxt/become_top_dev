cards:
  - id: fc1
    front: "Qu'est-ce qu'une closure ?"
    back: "Une fonction déclarée dans une autre, qui peut lire et modifier les variables de la fonction englobante, même après son retour."
    concept: go-closure-capture
  - id: fc2
    front: "Une closure copie-t-elle les variables qu'elle utilise ?"
    back: "Non : elle les capture par référence. Elle et la fonction extérieure partagent la même variable."
    concept: go-closure-capture
  - id: fc3
    front: "Dans une closure, = ou := pour modifier une variable extérieure ?"
    back: "=. Avec :=, on crée une variable locale qui masque l'extérieure."
    concept: go-closure-capture
  - id: fc4
    front: "Comment une closure garde-t-elle un état ?"
    back: "En modifiant une variable capturée : l'état persiste entre ses appels, et chaque fonction fabriquée a le sien."
    concept: go-closure-state
  - id: fc5
    front: "Deux appels à counter() partagent-ils leur compteur ?"
    back: "Non : chaque appel crée un nouvel environnement, donc deux compteurs indépendants."
    concept: go-closure-state
  - id: fc6
    front: "Que fait sort.Slice(xs, less) ?"
    back: "Trie xs selon la closure less(i, j) bool, qui compare les éléments aux indices i et j."
    concept: go-func-param
  - id: fc7
    front: "Quelle forme moderne remplace sort.Slice ?"
    back: "slices.SortFunc(xs, func(a, b T) int { … }) (Go 1.21+) : la fonction reçoit les éléments et renvoie un entier négatif, nul ou positif."
    concept: go-func-param
  - id: fc8
    front: "Que renvoie makeMult(3) ?"
    back: "Une fonction func(int) int qui multiplie son argument par 3, car elle a capturé base = 3."
    concept: go-func-return
  - id: fc9
    front: "Qu'a changé Go 1.22 pour les closures dans les boucles ?"
    back: "Chaque tour de boucle a sa propre variable : les closures créées dans la boucle capturent chacune une valeur différente."
    concept: go-closure-capture
