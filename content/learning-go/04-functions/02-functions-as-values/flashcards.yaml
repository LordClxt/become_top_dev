cards:
  - id: fc1
    front: "Qu'est-ce qui fait le type d'une fonction ?"
    back: "Sa signature : les types de ses paramètres et de ses retours. Les noms ne comptent pas."
    concept: go-func-types
  - id: fc2
    front: "Quelle est la valeur zéro d'un type fonction, et que provoque son appel ?"
    back: "nil ; l'appeler déclenche un panic."
    concept: go-func-values
  - id: fc3
    front: "Pourquoi une map de fonctions plutôt qu'un switch ?"
    back: "Ajouter un comportement revient à ajouter une entrée dans la map, sans modifier la logique d'évaluation."
    concept: go-func-values
  - id: fc4
    front: "Comment tester qu'une clé de map de fonctions existe ?"
    back: "Avec l'idiome comma ok : op, ok := ops[symbol]."
    concept: go-func-values
  - id: fc5
    front: "func(int, int) (int, error) est-il assignable à func(int, int) int ?"
    back: "Non : le nombre de valeurs de retour fait partie de la signature."
    concept: go-func-types
  - id: fc6
    front: "À quoi sert type BinaryOp func(int, int) int ?"
    back: "À nommer une signature pour la lisibilité. Toute fonction de cette forme y correspond sans modification."
    concept: go-func-types
  - id: fc7
    front: "Comment appelle-t-on une fonction anonyme immédiatement ?"
    back: "En ajoutant des parenthèses (avec les arguments) après son accolade fermante : func(j int) { … }(i)."
    concept: go-anon-func
  - id: fc8
    front: "Où une fonction anonyme appelée sur place est-elle utile ?"
    back: "Avec defer et pour lancer des goroutines."
    concept: go-anon-func
  - id: fc9
    front: "Pourquoi éviter une variable de package qui contient une fonction ?"
    back: "Elle est réaffectable : le comportement d'un appel peut changer sans que l'appelant le sache."
    concept: go-anon-func
