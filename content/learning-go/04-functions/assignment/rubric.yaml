criteria:
  - id: correctness
    label: "Correction (tests)"
    weight: 0.5
    source: tests
  - id: composition
    label: "Composition des fonctions"
    weight: 0.2
    source: ai
    levels:
      4: "Chain construit la pile en boucle à l'envers, chaque middleware est une closure qui retourne un Handler, aucun état global"
      2: "Correct mais avec de la duplication, ou un état partagé entre requêtes"
      0: "Ordre d'enveloppement faux ou dépendance à des variables de package"
  - id: errors
    label: "Gestion des erreurs et du flux"
    weight: 0.15
    source: ai
    levels:
      4: "Retour anticipé sur erreur, valeur de retour vide en cas d'erreur, aucune erreur avalée, dernier essai de Retry renvoyé"
      2: "Correct mais avec des else inutiles ou des valeurs de retour incohérentes en cas d'erreur"
      0: "Erreurs perdues ou modifiées sans raison"
  - id: readability
    label: "Lisibilité et idiomes"
    weight: 0.15
    source: ai
    levels:
      4: "Noms clairs (next, request, response), pas de retour nu, pas de shadowing de err, commentaires utiles"
      2: "Lisible mais noms peu parlants ou imbrication inutile"
      0: "Difficile à suivre"
