id: go-ch05-l02-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      failedUpdate := func(px *int) {
      	x2 := 20
      	px = &x2
      }
      update := func(px *int) {
      	*px = 20
      }
      x := 10
      failedUpdate(&x)
      fmt.Println(x)
      update(&x)
      fmt.Println(x)
    answer: "10\n20"
    explanation: "Dans failedUpdate, on fait pointer la copie px vers une autre variable : l'appelant ne voit rien. Dans update, *px = 20 écrit dans x lui-même."
    concept: go-pointer-copy-semantics
    difficulty: 2
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      var f *int
      set := func(g *int) {
      	x := 10
      	g = &x
      }
      set(f)
      fmt.Println(f == nil)
    answer: "true"
    explanation: "g est une copie de f (nil). Faire pointer g sur x ne change pas f, qui reste nil."
    concept: go-pointer-copy-semantics
    difficulty: 2
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      type counter struct{ n int }
      inc := func(c *counter) {
      	c.n++
      }
      c := counter{}
      inc(&c)
      inc(&c)
      fmt.Println(c.n)
    answer: "2"
    explanation: "On passe l'adresse de c : la fonction modifie le champ de la struct d'origine."
    concept: go-pointer-mutable-param
    difficulty: 1
  - id: q4
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      type counter struct{ n int }
      inc := func(c counter) {
      	c.n++
      }
      c := counter{}
      inc(c)
      inc(c)
      fmt.Println(c.n)
    answer: "0"
    explanation: "Sans pointeur, la fonction reçoit une copie de la struct : l'original n'est jamais modifié."
    concept: go-pointer-mutable-param
    difficulty: 1
  - id: q5
    type: single
    prompt: "Pourquoi dit-on que Go, comme Java ou Python, est toujours « passé par valeur » ?"
    choices:
      - "Parce que les objets y sont copiés en entier à chaque appel"
      - "Parce que, même quand un objet est partagé, ce qu'on copie est le pointeur vers lui, pas l'objet"
      - "Parce que ces langages n'ont pas de pointeurs"
      - "Parce qu'ils interdisent la modification des paramètres"
    answer: 1
    explanation: "Passer un objet copie sa référence (un pointeur). Modifier un champ se voit ; réaffecter le paramètre ne se voit pas. Go se comporte pareil quand on lui passe un pointeur."
    concept: go-pointer-vs-class
    difficulty: 2
  - id: q6
    type: single
    prompt: "Que signifie, pour le lecteur, un paramètre de type *Account dans func Deposit(a *Account, amount int) ?"
    choices:
      - "Que l'Account est trop gros pour être copié"
      - "Que la fonction peut modifier l'Account de l'appelant"
      - "Que l'Account est immuable"
      - "Que l'Account vient de la base de données"
    answer: 1
    explanation: "Go n'a pas de déclaration d'immuabilité : un paramètre pointeur est la convention qui annonce une modification possible de la donnée de l'appelant."
    concept: go-pointer-mutable-param
    difficulty: 1
  - id: q7
    type: single
    prompt: "Quelle version de MakeFoo est la plus idiomatique ?"
    choices:
      - "func MakeFoo(f *Foo) error qui remplit f"
      - "func MakeFoo() (Foo, error) qui construit et renvoie la valeur"
      - "func MakeFoo(f Foo) qui modifie f"
      - "func MakeFoo() *Foo qui renvoie toujours un pointeur"
    answer: 1
    explanation: "On privilégie les valeurs : le flux de données est plus lisible et le ramasse-miettes a moins de travail."
    concept: go-pointer-last-resort
    difficulty: 1
  - id: q8
    type: single
    prompt: "Pourquoi json.Unmarshal prend-elle un pointeur plutôt que de renvoyer une valeur ?"
    choices:
      - "Parce que c'est plus rapide à chaque appel"
      - "Parce qu'elle date d'avant les génériques (elle ne peut pas connaître le type à renvoyer) et permet de réutiliser une variable"
      - "Parce que les structs ne peuvent pas être renvoyées"
      - "Parce que JSON est un format binaire"
    answer: 1
    explanation: "C'est une exception : la fonction reçoit un any et a besoin d'un pointeur pour remplir la donnée. Ne la généralise pas à tout ton code."
    concept: go-pointer-last-resort
    difficulty: 2
  - id: q9
    type: single
    prompt: "Pour une petite struct (quelques octets), qu'est-ce qui est généralement le plus rapide ?"
    choices:
      - "La renvoyer par valeur"
      - "Renvoyer un pointeur vers elle"
      - "Les deux sont identiques"
      - "Cela dépend de la couleur du terminal"
    answer: 0
    explanation: "Sous une dizaine de mégaoctets, renvoyer une valeur est plus rapide : un pointeur retourné peut forcer une allocation sur le tas. Mesure avant d'optimiser."
    concept: go-pointer-last-resort
    difficulty: 3
