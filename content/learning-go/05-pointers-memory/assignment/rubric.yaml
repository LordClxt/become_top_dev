criteria:
  - id: correctness
    label: "Correction (tests)"
    weight: 0.5
    source: tests
  - id: pointers
    label: "Maniement des pointeurs"
    weight: 0.25
    source: ai
    levels:
      4: "Relie les maillons existants sans copie, gère tête, milieu et queue de façon uniforme (par exemple avec l'adresse du pointeur à modifier), jamais de déréférencement d'un nil"
      2: "Correct mais avec des cas particuliers dupliqués pour la tête, ou des gardes nil incohérentes"
      0: "Panique sur nil, copie les maillons ou perd des maillons"
  - id: invariants
    label: "Invariants"
    weight: 0.1
    source: ai
    levels:
      4: "Len toujours cohérent, Head nil sur liste vide, aucun maillon retenu inutilement après suppression"
      2: "Len cohérent mais des cas limites oubliés"
      0: "Len incohérent ou liste corrompue"
  - id: readability
    label: "Lisibilité"
    weight: 0.15
    source: ai
    levels:
      4: "Noms parlants (current, previous, link), fonctions courtes, commentaires utiles"
      2: "Lisible mais noms peu clairs ou duplication"
      0: "Difficile à suivre"
