cards:
  - id: fc1
    front: "Qu'est-ce qu'un pointeur ?"
    back: "Une variable qui contient l'adresse d'une autre variable. Son type s'écrit *T."
    concept: go-pointer-basics
  - id: fc2
    front: "Que font & et * ?"
    back: "&x donne l'adresse de x ; *p donne (et permet d'écrire) la valeur pointée par p."
    concept: go-pointer-basics
  - id: fc3
    front: "Que compare p == q ? Et *p == *q ?"
    back: "p == q compare deux adresses ; *p == *q compare les valeurs pointées."
    concept: go-pointer-basics
  - id: fc4
    front: "Valeur zéro d'un pointeur ?"
    back: "nil. Ce n'est pas 0 : on ne peut pas les convertir l'un en l'autre."
    concept: go-nil-pointer
  - id: fc5
    front: "Que provoque *p quand p vaut nil ?"
    back: "Un panic : invalid memory address or nil pointer dereference."
    concept: go-nil-pointer
  - id: fc6
    front: "Comment créer un pointeur vers une struct ?"
    back: "&Person{…} (forme habituelle). new(Person) donne un pointeur vers une Person à sa valeur zéro."
    concept: go-new-and-literal
  - id: fc7
    front: "Faut-il écrire (*t).N pour lire un champ à travers un pointeur de struct ?"
    back: "Non : Go déréférence automatiquement. t.N suffit."
    concept: go-new-and-literal
  - id: fc8
    front: "Pourquoi &\"hello\" ne compile-t-il pas ?"
    back: "Un littéral n'a pas d'adresse. On le met dans une variable, ou on passe par une fonction générique comme makePointer."
    concept: go-pointer-to-constant
  - id: fc9
    front: "Go a-t-il de l'arithmétique de pointeurs ?"
    back: "Non (seul le paquet unsafe permet de le contourner)."
    concept: go-pointer-basics
