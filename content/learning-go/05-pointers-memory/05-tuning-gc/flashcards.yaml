cards:
  - id: fc1
    front: "Quelle formule donne le prochain déclenchement du GC ?"
    back: "TAS_ACTUEL + TAS_ACTUEL × GOGC / 100."
    concept: go-gogc
  - id: fc2
    front: "Valeur par défaut de GOGC ? Que signifie-t-elle ?"
    back: "100 : le prochain cycle démarre quand le tas a doublé depuis la fin du précédent."
    concept: go-gogc
  - id: fc3
    front: "Que fait diminuer GOGC ?"
    back: "Le GC passe plus souvent : tas plus petit, mais plus de temps de processeur."
    concept: go-gogc
  - id: fc4
    front: "Que fait doubler GOGC ?"
    back: "Environ moitié moins de temps de GC, mais un tas qui monte plus haut."
    concept: go-gogc
  - id: fc5
    front: "Que fait GOGC=off ?"
    back: "Désactive le GC : plus rapide, mais la mémoire n'est jamais récupérée."
    concept: go-gogc
  - id: fc6
    front: "À quoi sert GOMEMLIMIT ?"
    back: "Fixer un plafond souple de mémoire totale, comme -Xmx en Java. Désactivé par défaut."
    concept: go-gomemlimit
  - id: fc7
    front: "Quels suffixes accepte GOMEMLIMIT ?"
    back: "B, KiB, MiB, GiB et TiB (puissances de deux)."
    concept: go-gomemlimit
  - id: fc8
    front: "GOMEMLIMIT est-elle une limite stricte ?"
    back: "Non, souple : le runtime peut la dépasser pour éviter le thrashing. Fixe-la sous la mémoire réelle."
    concept: go-gomemlimit
  - id: fc9
    front: "Qu'est-ce que le thrashing du GC ?"
    back: "Le GC se déclenche en continu parce que le programme frôle sa limite : il ne fait plus que du ramasse-miettes."
    concept: go-gc-thrashing
  - id: fc10
    front: "Pourquoi combiner GOGC et GOMEMLIMIT ?"
    back: "Pour garder un rythme de GC régulier et un maximum de mémoire respecté, sans pauses rares et longues."
    concept: go-gc-thrashing
