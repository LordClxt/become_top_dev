cards:
  - id: fc1
    front: "Que compte len sur une string ?"
    back: "Des bytes, pas des caractères."
    concept: go-string-bytes
  - id: fc2
    front: "Combien de bytes peut occuper un caractère en UTF-8 ?"
    back: "De 1 (ASCII) à 4 (la plupart des emojis)."
    concept: go-string-utf8
  - id: fc3
    front: "Comment compter les caractères d'une string ?"
    back: "utf8.RuneCountInString(s)."
    concept: go-string-utf8
  - id: fc4
    front: "Que renvoie string(65) ?"
    back: "\"A\" : l'entier est lu comme un point de code. Pour \"65\", utilise strconv.Itoa."
    concept: go-string-conversions
  - id: fc5
    front: "rune est un alias de quel type ?"
    back: "int32. byte est un alias de uint8."
    concept: go-string-conversions
  - id: fc6
    front: "Dans for i, r := range s, que représente i ?"
    back: "La position en bytes du début de la rune r."
    concept: go-string-utf8
