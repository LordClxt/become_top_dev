id: go-ch02-l05-quiz
questions:
  - id: q1
    type: single
    prompt: "Que se passe-t-il avec `var m map[string]int; m[\"a\"] = 1` ?"
    choices:
      - "m contient a: 1"
      - "Erreur de compilation"
      - "Panic à l'exécution"
      - "Rien, l'écriture est ignorée"
    answer: 2
    explanation: "Une map nil peut être lue, mais pas écrite : panic « assignment to entry in nil map »."
    concept: go-map-nil
    difficulty: 1
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      m := map[string]int{"a": 0}
      v1, ok1 := m["a"]
      v2, ok2 := m["b"]
      fmt.Println(v1, ok1, v2, ok2)
    answer: "0 true 0 false"
    explanation: "Les deux lectures renvoient 0. Seul ok distingue la clé présente avec la valeur 0 de la clé absente."
    concept: go-map-comma-ok
    difficulty: 1
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      count := map[rune]int{}
      for _, r := range "banana" {
          count[r]++
      }
      fmt.Println(count['a'], count['z'], len(count))
    answer: "3 0 3"
    explanation: "Une clé absente vaut 0, donc count[r]++ fonctionne dès la première occurrence. Il y a 3 lettres distinctes : b, a, n."
    concept: go-map-comma-ok
    difficulty: 2
  - id: q4
    type: single
    prompt: "Quel type ne peut PAS servir de clé de map ?"
    choices: ["[2]int", "string", "[]int", "struct{ X, Y int }"]
    answer: 2
    explanation: "Une clé doit être comparable avec ==. Les slices ne le sont pas, les arrays et structs de champs comparables oui."
    concept: go-map-keys
    difficulty: 2
  - id: q5
    type: single
    prompt: "Un test parcourt une map avec range et compare la sortie à une liste fixe. Il passe parfois, échoue parfois. Pourquoi ?"
    choices:
      - "Le ramasse-miettes réorganise la map"
      - "L'ordre de parcours d'une map est volontairement aléatoire"
      - "Les maps ne sont pas thread-safe"
      - "range sur une map saute des éléments"
    answer: 1
    explanation: "Go randomise l'ordre de parcours. Il faut trier les clés pour obtenir un ordre stable."
    concept: go-map-keys
    difficulty: 1
  - id: q6
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      m := map[string]int{"a": 1, "b": 2}
      s := []int{1, 2}
      clear(m)
      clear(s)
      fmt.Println(len(m), len(s))
    answer: "0 2"
    explanation: "clear vide une map (len 0), mais remet seulement à zéro les éléments d'une slice (len inchangée)."
    concept: go-map-nil
    difficulty: 3
