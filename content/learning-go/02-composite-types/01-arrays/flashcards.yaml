cards:
  - id: fc1
    front: "[3]int et [4]int sont-ils le même type ?"
    back: "Non. La taille fait partie du type d'un array."
    concept: go-array-size-in-type
  - id: fc2
    front: "Que se passe-t-il quand on passe un array à une fonction ?"
    back: "Il est copié entièrement. La fonction travaille sur sa propre copie."
    concept: go-array-value-semantics
  - id: fc3
    front: "Que signifie [...] dans [...]int{1, 2, 3} ?"
    back: "Le compilateur compte les éléments. Le résultat est un array de type [3]int."
    concept: go-array-size-in-type
  - id: fc4
    front: "Peut-on comparer deux arrays avec == ?"
    back: "Oui, s'ils ont le même type. La comparaison se fait case par case."
    concept: go-array-value-semantics
  - id: fc5
    front: "À quoi servent principalement les arrays en Go ?"
    back: "De stockage sous-jacent aux slices, et aux données de taille fixe (empreintes, grilles)."
    concept: go-array-size-in-type
