id: go-ch02-l01-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      a := [3]int{1, 2, 3}
      b := a
      b[0] = 100
      fmt.Println(a[0], b[0])
    answer: "1 100"
    explanation: "Assigner un array copie toutes ses cases. Modifier b ne touche pas a."
    concept: go-array-value-semantics
    difficulty: 1
  - id: q2
    type: single
    prompt: "Pourquoi ne peut-on pas écrire une fonction qui accepte un array de n'importe quelle taille ?"
    choices:
      - "Parce que les arrays sont toujours alloués sur le tas"
      - "Parce que la taille fait partie du type : [3]int et [4]int sont des types différents"
      - "Parce que Go interdit les arrays en paramètre"
      - "Parce que len ne fonctionne pas sur les arrays"
    answer: 1
    explanation: "La taille est inscrite dans le type. Une fonction qui prend [3]int ne peut recevoir que des [3]int."
    concept: go-array-size-in-type
    difficulty: 1
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := [5]int{1, 3: 9}
      fmt.Println(x)
    answer: "[1 0 0 9 0]"
    explanation: "Les index non précisés reçoivent la valeur zéro. 3: 9 place 9 à l'index 3."
    concept: go-array-size-in-type
    difficulty: 2
  - id: q4
    type: single
    prompt: "Que se passe-t-il avec `n := 4; var a [n]int` ?"
    choices:
      - "Un array de 4 entiers est créé"
      - "Une panic à l'exécution"
      - "Une erreur de compilation : la taille doit être une constante"
      - "Un array vide est créé"
    answer: 2
    explanation: "La taille d'un array doit être connue à la compilation, car elle fait partie du type."
    concept: go-array-size-in-type
    difficulty: 2
  - id: q5
    type: multiple
    prompt: "Dans quels cas un array est-il un bon choix ?"
    choices:
      - "Une empreinte SHA-256 de 32 octets"
      - "La liste des utilisateurs connectés"
      - "Une grille de morpion 3×3"
      - "Les lignes lues dans un fichier"
    answer: [0, 2]
    explanation: "Un array convient quand la taille est fixe et fait partie du problème. Une liste qui grandit appelle une slice."
    concept: go-array-size-in-type
    difficulty: 1
  - id: q6
    type: single
    prompt: "Que donne `[3]int{1, 2, 3} == [...]int{1, 2, 3}` ?"
    choices: ["true", "false", "Erreur de compilation", "Panic"]
    answer: 0
    explanation: "[...] laisse le compilateur compter : le type est [3]int. Deux arrays de même type se comparent case par case."
    concept: go-array-value-semantics
    difficulty: 2
