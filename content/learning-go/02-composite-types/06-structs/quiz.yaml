id: go-ch02-l06-quiz
questions:
  - id: q1
    type: single
    prompt: "Pourquoi préférer `Person{Name: \"Ana\", Age: 30}` à `Person{\"Ana\", 30, \"\"}` ?"
    choices:
      - "C'est plus rapide à l'exécution"
      - "C'est lisible sans la définition et ça ne casse pas quand on ajoute un champ"
      - "Le style positionnel est interdit en Go"
      - "Le style nommé alloue moins de mémoire"
    answer: 1
    explanation: "Le style positionnel exige tous les champs dans l'ordre : ajouter un champ casse chaque littéral."
    concept: go-struct-literals
    difficulty: 1
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      type P struct {
          Name string
          Age  int
      }
      var a P
      b := P{}
      fmt.Println(a == b, a.Age)
    answer: "true 0"
    explanation: "Une struct non initialisée et une struct vide sont identiques : chaque champ vaut sa valeur zéro."
    concept: go-struct-literals
    difficulty: 1
  - id: q3
    type: single
    prompt: "Que se passe-t-il si on compare avec == deux valeurs d'une struct qui contient un champ []string ?"
    choices: ["true si le contenu est égal", "false toujours", "Erreur de compilation", "Panic"]
    answer: 2
    explanation: "Une struct n'est comparable que si tous ses champs le sont. Une slice ne l'est pas."
    concept: go-struct-comparable
    difficulty: 2
  - id: q4
    type: single
    prompt: "Dans quel cas une struct anonyme est-elle le plus utile ?"
    choices:
      - "Pour définir le modèle principal de l'application"
      - "Pour une slice de cas dans un test en table"
      - "Pour remplacer toutes les maps"
      - "Pour partager un type entre packages"
    answer: 1
    explanation: "Une struct anonyme sert pour une forme utilisée à un seul endroit : cas de test, JSON ponctuel."
    concept: go-struct-anonymous
    difficulty: 1
  - id: q5
    type: single
    prompt: "Peut-on convertir `type A struct{ X int; Y string }` en `type B struct{ Y string; X int }` ?"
    choices: ["Oui", "Non, l'ordre des champs diffère", "Oui, mais seulement avec reflect", "Non, les noms diffèrent"]
    answer: 1
    explanation: "La conversion exige les mêmes noms, le même ordre et les mêmes types de champs."
    concept: go-struct-comparable
    difficulty: 2
