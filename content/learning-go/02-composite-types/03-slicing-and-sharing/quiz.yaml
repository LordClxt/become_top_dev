id: go-ch02-l03-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := []int{1, 2, 3, 4}
      y := x[1:3]
      y[0] = 20
      fmt.Println(x)
    answer: "[1 20 3 4]"
    explanation: "y est une fenêtre sur le même array que x. y[0] est la même case que x[1]."
    concept: go-slice-shared-memory
    difficulty: 1
  - id: q2
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := []string{"a", "b", "c", "d"}
      y := x[:2]
      y = append(y, "z")
      fmt.Println(x)
    answer: "[a b z d]"
    explanation: "y a une capacité 4. append écrit dans la case 2, qui appartient aussi à x."
    concept: go-slice-append-overwrite
    difficulty: 2
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      x := []string{"a", "b", "c", "d"}
      y := x[:2:2]
      y = append(y, "z")
      fmt.Println(x, y)
    answer: "[a b c d] [a b z]"
    explanation: "La capacité de y est 2. append doit réallouer : y part sur un nouvel array et x reste intact."
    concept: go-slice-full-expression
    difficulty: 2
  - id: q4
    type: code-output
    prompt: "Qu'affiche ce programme ? (piège)"
    code: |
      x := make([]string, 0, 5)
      x = append(x, "a", "b", "c", "d")
      y := x[:2]
      z := x[2:]
      y = append(y, "i", "j", "k")
      x = append(x, "x")
      z = append(z, "y")
      fmt.Println(x, y, z)
    answer: "[a b i j y] [a b i j y] [i j y]"
    explanation: "Les trois slices partagent le même array de 5 cases. Chaque append écrit dans une case libre déjà réservée : y écrit i j k en 2-4, x écrit x en 4, puis z écrit y en 4."
    concept: go-slice-append-overwrite
    difficulty: 3
  - id: q5
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      src := []int{1, 2, 3}
      dst := make([]int, 0, 10)
      n := copy(dst, src)
      fmt.Println(n, dst)
    answer: "0 []"
    explanation: "copy copie min(len(dst), len(src)) éléments. len(dst) vaut 0 : rien n'est copié, la capacité ne compte pas."
    concept: go-slice-copy
    difficulty: 2
  - id: q6
    type: single
    prompt: "Quelle est la capacité de `s[2:4:6]` si s a une capacité de 10 ?"
    choices: ["2", "4", "6", "8"]
    answer: 1
    explanation: "Avec s[début:fin:max], la capacité vaut max - début = 6 - 2 = 4."
    concept: go-slice-full-expression
    difficulty: 2
  - id: q7
    type: single
    prompt: "Tu dois renvoyer une partie d'une slice, et l'appelant pourra la modifier librement. Quelle option garantit l'indépendance totale ?"
    choices:
      - "return s[a:b]"
      - "return s[a:b:b]"
      - "return slices.Clone(s[a:b])"
      - "return s[:]"
    answer: 2
    explanation: "s[a:b:b] protège seulement contre append. Une modification par index toucherait encore s. Seule une copie garantit l'indépendance."
    concept: go-slice-copy
    difficulty: 3
