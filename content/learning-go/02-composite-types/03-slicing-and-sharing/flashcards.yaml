cards:
  - id: fc1
    front: "y := x[1:3] copie-t-il des données ?"
    back: "Non. y est une fenêtre sur le même array que x : modifier y[0] modifie x[1]."
    concept: go-slice-shared-memory
  - id: fc2
    front: "Pourquoi append sur une sous-slice peut-il écraser la slice parente ?"
    back: "La sous-slice garde la capacité restante de la parente. Tant qu'il reste de la place, append écrit dans les cases de la parente."
    concept: go-slice-append-overwrite
  - id: fc3
    front: "Quelle est la capacité de s[a:b:c] ?"
    back: "c - a."
    concept: go-slice-full-expression
  - id: fc4
    front: "Combien d'éléments copy(dst, src) copie-t-il ?"
    back: "min(len(dst), len(src)). La capacité de dst n'est pas prise en compte."
    concept: go-slice-copy
  - id: fc5
    front: "Comment obtenir une copie indépendante d'une slice en une ligne ?"
    back: "slices.Clone(s)."
    concept: go-slice-copy
  - id: fc6
    front: "Que fait s[a:b:b] ?"
    back: "Crée une sous-slice sans capacité libre : le premier append la détache sur un nouvel array."
    concept: go-slice-full-expression
