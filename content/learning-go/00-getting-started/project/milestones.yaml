milestones:
  - id: m1
    title: "Lire le Makefile"
    goal: "Découper le texte en cibles, dépendances et commandes ; reconnaître .DEFAULT_GOAL et .PHONY ; refuser une commande indentée avec des espaces."
    tests: "go test ./... -run TestM1"
    review: false
  - id: m2
    title: "Planifier"
    goal: "Pour une cible, calculer l'ordre d'exécution : dépendances d'abord, chacune une fois, avec détection des cycles et des cibles inconnues."
    tests: "go test ./... -run TestM2"
    review: false
  - id: m3
    title: "Exécuter"
    goal: "Lancer les commandes dans l'ordre du plan et s'arrêter à la première erreur, en disant quelle cible a échoué."
    tests: "go test ./... -run TestM3"
    review: true
