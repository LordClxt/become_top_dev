id: go-ch00-l02-quiz
questions:
  - id: q1
    type: single
    prompt: "Pourquoi ce code ne compile-t-il pas ?\n\nfunc main()\n{\n    fmt.Println(\"ok\")\n}"
    choices:
      - "go fmt n'a pas été lancé"
      - "Le lexer insère un ; après ), donc le compilateur lit une déclaration sans corps"
      - "Il manque le mot-clé return"
      - "L'indentation utilise des espaces au lieu de tabulations"
    answer: 1
    explanation: "La ligne finit par ), donc un point-virgule est inséré : func main(); puis un bloc { } orphelin."
    concept: go-semicolon-insertion
    difficulty: 1
  - id: q2
    type: multiple
    prompt: "Après quels derniers tokens le lexer insère-t-il un point-virgule ?"
    choices: ["count++", "x := a +", "return", "} else", "name", "fmt.Println(a,"]
    answer: [0, 2, 4]
    explanation: "++, return et un identifiant terminent l'instruction. +, else et la virgule annoncent une suite."
    concept: go-semicolon-insertion
    difficulty: 2
  - id: q3
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      total := 10 +
      	5
      fmt.Println(total)
    answer: "15"
    explanation: "La première ligne finit par +, aucun ; n'est inséré : l'expression continue sur la ligne suivante."
    concept: go-semicolon-insertion
    difficulty: 1
  - id: q4
    type: code-output
    prompt: "Qu'affiche ce programme ?"
    code: |
      ports := []int{
      	8080,
      	8443,
      }
      fmt.Println(len(ports), ports[1])
    answer: "2 8443"
    explanation: "La virgule finale empêche l'insertion d'un ; après 8443 : la liste se ferme proprement sur }."
    concept: go-semicolon-insertion
    difficulty: 1
  - id: q5
    type: single
    prompt: "Quelle était la motivation première d'un format unique, selon Russ Cox ?"
    choices:
      - "Mettre fin aux débats sur les tabulations"
      - "Faciliter l'écriture d'outils qui lisent et génèrent du code"
      - "Rendre le compilateur multiplateforme"
      - "Réduire la taille des binaires"
    answer: 1
    explanation: "L'outillage était le but. La fin des débats de style est un effet secondaire bienvenu."
    concept: go-fmt-standard
    difficulty: 2
  - id: q6
    type: single
    prompt: "Que fait `go fmt ./...` ?"
    choices:
      - "Formate uniquement le fichier ouvert"
      - "Formate le package courant et tous ses sous-dossiers"
      - "Vérifie le format sans rien modifier"
      - "Formate puis compile"
    answer: 1
    explanation: "./... désigne ce dossier et tous ses sous-dossiers. go fmt réécrit les fichiers."
    concept: go-fmt-standard
    difficulty: 1
  - id: q7
    type: single
    prompt: "Tu reprends un vieux projet mal formaté et tu dois aussi corriger un bug. Que fais-tu ?"
    choices:
      - "Un seul commit : formatage et correctif"
      - "Un commit qui ne fait que go fmt, puis un commit pour le correctif"
      - "Tu ne formates pas pour ne pas polluer l'historique"
      - "Tu formates à la main seulement les lignes modifiées"
    answer: 1
    explanation: "Séparer le formatage évite de noyer le vrai changement dans des centaines de lignes de bruit."
    concept: go-fmt-standard
    difficulty: 1
