cards:
  - id: fc1
    front: "Qui écrit les points-virgules en Go ?"
    back: "Le lexer, automatiquement en fin de ligne. On n'en écrit jamais soi-même."
    concept: go-semicolon-insertion
  - id: fc2
    front: "Après quels tokens de fin de ligne un ; est-il inséré ?"
    back: "Identifiant, littéral, break, continue, fallthrough, return, ++, --, ), ], }."
    concept: go-semicolon-insertion
  - id: fc3
    front: "Pourquoi l'accolade ouvrante doit-elle rester sur la même ligne ?"
    back: "Sinon un ; est inséré après ) et la déclaration n'a plus de corps."
    concept: go-semicolon-insertion
  - id: fc4
    front: "Pourquoi une virgule finale dans un littéral sur plusieurs lignes ?"
    back: "Sans elle, le dernier élément est suivi d'un ; inséré, et la liste ne compile pas."
    concept: go-semicolon-insertion
  - id: fc5
    front: "Où couper une longue expression ?"
    back: "Après l'opérateur (a +), jamais avant : sinon un ; est inséré."
    concept: go-semicolon-insertion
  - id: fc6
    front: "Que signifie ./... dans une commande go ?"
    back: "Le dossier courant et tous ses sous-dossiers."
    concept: go-fmt-standard
  - id: fc7
    front: "Que normalise go fmt ?"
    back: "Indentation en tabulations, espaces, alignement des commentaires et des champs."
    concept: go-fmt-standard
