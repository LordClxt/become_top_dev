<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta name="visual-id" content="go-ch00-make-pipeline" />
    <title>make : fmt, vet, build</title>
    <!--
      Choreography (12 s) :
        0.0 – 0.6   décor : 4 étapes + terminal
        0.6 – 1.3   on tape « make »
        1.5 – 2.9   résolution : build → vet → fmt (impulsion qui remonte les flèches)
        3.0 – 5.0   exécution : fmt ✓, vet ✗ (Printf sans argument), build sauté
        5.6 – 6.8   correctif dans hello.go
        7.0 – 10.0  on relance : fmt ✓ vet ✓ build ✓, le binaire sort
      État = fonction pure du temps (un driver + onUpdate), aucune transition CSS.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0c0d12;
        --surface: #15161e;
        --surface-2: #1d1f2b;
        --line: #2b2e40;
        --text: #f4f4ef;
        --muted: #a3a5b8;
        --accent: #d6ff3d;
        --pass: #5be49b;
        --fail: #e3a93c;
      }
      html.light {
        --ink: #f3f2ec;
        --surface: #ffffff;
        --surface-2: #e9e8e0;
        --line: #d9d7cc;
        --text: #0c0d12;
        --muted: #5b5d6e;
        --accent: #3a3dff;
        --pass: #1f8a50;
        --fail: #a86b00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
        color: var(--text);
        font-family: "Schibsted Grotesk", system-ui, sans-serif;
      }
      #root {
        position: absolute;
        inset: 0;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        top: 70px;
        text-align: center;
        font-size: 50px;
        font-weight: 700;
        opacity: 0;
      }
      .caption em {
        font-style: normal;
        color: var(--accent);
      }

      .node {
        position: absolute;
        top: 220px;
        width: 300px;
        height: 170px;
        margin-left: -150px;
        border-radius: 28px;
        border: 4px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        will-change: transform;
      }
      .node .name {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 54px;
        font-weight: 600;
      }
      .node .status {
        font-size: 30px;
        color: var(--muted);
        height: 36px;
      }
      .node.ask {
        border-color: var(--accent);
        border-style: dashed;
      }
      .node.run {
        border-color: var(--accent);
        background: var(--surface-2);
      }
      .node.ok {
        border-color: var(--pass);
      }
      .node.ok .status {
        color: var(--pass);
      }
      .node.fail {
        border-color: var(--fail);
      }
      .node.fail .status {
        color: var(--fail);
      }
      .node.skip {
        opacity: 0.35;
        border-style: dashed;
      }
      .node.binary,
      .wire.last {
        opacity: 0;
        border-radius: 20px;
        border-color: var(--pass);
        background: var(--surface-2);
      }
      .node.binary .name {
        font-size: 40px;
      }

      .wire {
        position: absolute;
        top: 301px;
        height: 8px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .wire .fill {
        position: absolute;
        inset: 0;
        background: var(--pass);
        transform-origin: left center;
        transform: scaleX(0);
      }
      .pulse {
        position: absolute;
        top: 291px;
        width: 28px;
        height: 28px;
        margin-left: -14px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 30px var(--accent);
        opacity: 0;
      }

      .term {
        position: absolute;
        left: 160px;
        right: 160px;
        top: 480px;
        height: 520px;
        border-radius: 28px;
        border: 3px solid var(--line);
        background: var(--surface);
        padding: 36px 48px;
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 36px;
        line-height: 1.55;
        overflow: hidden;
      }
      #lines {
        white-space: pre;
      }
      .term .bar {
        display: flex;
        gap: 14px;
        margin-bottom: 18px;
      }
      .term .bar i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--line);
      }
      .term .bar span {
        margin-left: 18px;
        font-size: 26px;
        color: var(--muted);
        line-height: 18px;
      }
      .l-cmd::before {
        content: "$ ";
        color: var(--accent);
      }
      .l-out {
        color: var(--muted);
      }
      .l-err {
        color: var(--fail);
      }
      .l-del {
        color: var(--fail);
      }
      .l-add {
        color: var(--pass);
      }
      .cursor {
        display: inline-block;
        width: 20px;
        height: 40px;
        vertical-align: -6px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="caption" id="c1">Tu tapes <em>make</em> : la cible par défaut est <em>build</em></div>
      <div class="caption" id="c2">make remonte les dépendances : build → vet → fmt</div>
      <div class="caption" id="c3">vet échoue : make s'arrête, build n'est <em>jamais</em> lancé</div>
      <div class="caption" id="c4">On corrige l'appel à Printf…</div>
      <div class="caption" id="c5">…et une seule commande refait tout, <em>toujours dans le même ordre</em></div>

      <div class="wire" style="left: 510px; width: 100px"><div class="fill" id="w1"></div></div>
      <div class="wire" style="left: 910px; width: 100px"><div class="fill" id="w2"></div></div>
      <div class="wire last" style="left: 1310px; width: 100px"><div class="fill" id="w3"></div></div>
      <div class="pulse" id="pulse"></div>

      <div class="node" id="n-fmt" style="left: 360px"><div class="name">fmt</div><div class="status"></div></div>
      <div class="node" id="n-vet" style="left: 760px"><div class="name">vet</div><div class="status"></div></div>
      <div class="node" id="n-build" style="left: 1160px"><div class="name">build</div><div class="status"></div></div>
      <div class="node binary" id="n-bin" style="left: 1560px">
        <div class="name">hello_world</div>
        <div class="status" style="color: var(--pass)">binaire natif</div>
      </div>

      <div class="term" id="term">
        <div class="bar"><i></i><i></i><i></i><span>~/hello_world</span></div>
        <div id="lines"></div>
      </div>
    </div>

    <script>
      const DURATION = 12;
      const tl = gsap.timeline({ paused: true });

      // --- Terminal : une liste d'états, chacun valable jusqu'au suivant -----------------
      const ERR = "./hello.go:6:2: fmt.Printf format %s reads arg #1,\n    but call has 0 args";
      const RUN1 = [
        { t: 3.0, cls: "l-out", text: "go fmt ./..." },
        { t: 3.8, cls: "l-out", text: "go vet ./..." },
        { t: 4.4, cls: "l-err", text: ERR },
        { t: 4.8, cls: "l-err", text: "make: *** [vet] Error 1" },
      ];
      const FIX = [
        { t: 5.6, cls: "l-out", text: "hello.go, ligne 6 :" },
        { t: 5.9, cls: "l-del", text: '- fmt.Printf("Hello, %s!\\n")' },
        { t: 6.3, cls: "l-add", text: '+ fmt.Printf("Hello, %s!\\n", "world")' },
      ];
      const RUN2 = [
        { t: 7.4, cls: "l-out", text: "go fmt ./..." },
        { t: 8.0, cls: "l-out", text: "go vet ./..." },
        { t: 8.6, cls: "l-out", text: "go build" },
      ];
      function typed(t, start, word) {
        const n = Math.max(0, Math.min(word.length, Math.floor((t - start) / 0.15) + 1));
        return t < start ? "" : word.slice(0, n);
      }
      function terminalAt(t) {
        if (t < 5.4) {
          return [{ cls: "l-cmd", text: typed(t, 0.7, "make"), cursor: t < 2.9 }, ...RUN1.filter((l) => t >= l.t)];
        }
        if (t < 7.0) return FIX.filter((l) => t >= l.t);
        return [{ cls: "l-cmd", text: typed(t, 7.0, "make"), cursor: t < 7.4 }, ...RUN2.filter((l) => t >= l.t)];
      }

      // --- Étapes : statut de chaque nœud en fonction du temps ---------------------------
      function nodeAt(name, t) {
        const run2 = t >= 7.0;
        if (run2) {
          const done = { fmt: 7.7, vet: 8.3, build: 9.0 }[name];
          const start = { fmt: 7.4, vet: 8.0, build: 8.6 }[name];
          if (t >= done) return ["ok", "✓ ok"];
          if (t >= start) return ["run", "en cours…"];
          return ["", ""];
        }
        const ask = { build: 1.5, vet: 2.0, fmt: 2.5 }[name];
        if (name === "fmt") {
          if (t >= 3.4) return ["ok", "✓ ok"];
          if (t >= 3.0) return ["run", "en cours…"];
        }
        if (name === "vet") {
          if (t >= 4.4) return ["fail", "✗ échec"];
          if (t >= 3.8) return ["run", "en cours…"];
        }
        if (name === "build" && t >= 4.8) return ["skip", "non exécuté"];
        if (t >= ask) return ["ask", "dépend de…"];
        return ["", ""];
      }

      const lines = document.getElementById("lines");
      const nodes = ["fmt", "vet", "build"].map((name) => {
        const el = document.getElementById("n-" + name);
        return { name, el, status: el.querySelector(".status") };
      });
      let lastKey = "";
      function render(t) {
        const term = terminalAt(t);
        const key = JSON.stringify(term);
        if (key !== lastKey) {
          lastKey = key;
          lines.innerHTML = "";
          for (const l of term) {
            const div = document.createElement("div");
            div.className = l.cls;
            div.textContent = l.text;
            if (l.cursor) div.appendChild(Object.assign(document.createElement("span"), { className: "cursor" }));
            lines.appendChild(div);
          }
        }
        for (const n of nodes) {
          const [cls, label] = nodeAt(n.name, t);
          n.el.className = "node " + cls;
          n.status.textContent = label;
        }
      }
      const driver = { t: 0 };
      tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(driver.t) }, 0);

      // --- Mouvement -----------------------------------------------------------------------
      tl.fromTo(".node:not(.binary), .wire:not(.last)", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.05, ease: "power3.out" }, 0);
      tl.fromTo("#term", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);

      // Légendes : chacune entre puis sort avant la suivante.
      const CAPTIONS = [
        ["#c1", 0.6, 1.5],
        ["#c2", 1.5, 3.0],
        ["#c3", 4.4, 5.5],
        ["#c4", 5.5, 7.0],
        ["#c5", 9.4, DURATION + 1],
      ];
      for (const [sel, a, b] of CAPTIONS) {
        tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, a);
        if (b < DURATION) tl.to(sel, { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, b - 0.25);
      }

      // Résolution : une impulsion remonte de build vers fmt.
      tl.fromTo("#pulse", { x: 1160, opacity: 0 }, { x: 1160, opacity: 1, duration: 0.15, immediateRender: false }, 1.5);
      tl.fromTo("#pulse", { x: 1160 }, { x: 760, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 1.6);
      tl.fromTo("#pulse", { x: 760 }, { x: 360, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 2.1);
      tl.to("#pulse", { opacity: 0, duration: 0.2 }, 2.7);

      // Exécution n°1 : seul fmt → vet se remplit.
      tl.fromTo("#w1", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 3.4);
      tl.to("#n-vet", { keyframes: { x: [0, -14, 12, -8, 5, 0] }, duration: 0.45, ease: "none" }, 4.4);
      tl.to("#w1", { scaleX: 0, duration: 0.2 }, 6.9);

      // Exécution n°2 : tout passe, le binaire sort.
      tl.fromTo("#w1", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 7.7);
      tl.fromTo("#w2", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 8.3);
      tl.fromTo(".wire.last", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 8.9);
      tl.fromTo("#w3", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 9.0);
      tl.fromTo("#n-bin", { opacity: 0, x: -60, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 9.2);

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
