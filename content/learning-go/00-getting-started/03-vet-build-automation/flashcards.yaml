cards:
  - id: fc1
    front: "Que fait go vet ?"
    back: "Il signale du code qui compile mais qui est très probablement faux, comme un Printf dont les verbes ne correspondent pas aux valeurs."
    concept: go-vet-printf
  - id: fc2
    front: "Qu'affiche fmt.Printf(\"%d\\n\") sans valeur ?"
    back: "%!d(MISSING) : fmt ne plante pas, il insère un marqueur d'erreur."
    concept: go-vet-printf
  - id: fc3
    front: "Comment écrire un % littéral dans un format Printf ?"
    back: "%%"
    concept: go-vet-printf
  - id: fc4
    front: "go test lance-t-il go vet ?"
    back: "Oui, une partie (dont la vérification de Printf). Si elle échoue, les tests ne tournent pas."
    concept: go-vet-printf
  - id: fc5
    front: "Dans `build: vet`, que signifie vet ?"
    back: "Une dépendance : la cible vet doit s'exécuter avant build."
    concept: go-makefile-targets
  - id: fc6
    front: "À quoi sert .PHONY dans un Makefile ?"
    back: "À déclarer des cibles qui ne sont pas des fichiers, pour que make les exécute toujours."
    concept: go-makefile-targets
  - id: fc7
    front: "Avec quoi indenter les commandes d'un Makefile ?"
    back: "Une tabulation. Des espaces donnent l'erreur « missing separator »."
    concept: go-makefile-targets
  - id: fc8
    front: "Que couvre la promesse de compatibilité Go 1 ?"
    back: "Le langage et la bibliothèque standard. Pas l'outil go, ni les bibliothèques tierces."
    concept: go-compat-promise
  - id: fc9
    front: "Pourquoi mettre à jour Go ne casse-t-il pas les programmes déjà déployés ?"
    back: "Chaque binaire embarque son runtime : il ne dépend pas de l'installation de Go."
    concept: go-compat-promise
