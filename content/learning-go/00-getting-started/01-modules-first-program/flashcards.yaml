cards:
  - id: fc1
    front: "Comment s'appelle un projet Go, et quel fichier le décrit ?"
    back: "Un module, décrit par go.mod à sa racine."
    concept: go-module-gomod
  - id: fc2
    front: "Que déclarent les lignes module et go d'un go.mod ?"
    back: "Le chemin du module (préfixe des imports) et la version minimale de Go."
    concept: go-module-gomod
  - id: fc3
    front: "Quelles commandes modifient go.mod à ta place ?"
    back: "go get pour ajouter ou mettre à jour, go mod tidy pour nettoyer."
    concept: go-module-gomod
  - id: fc4
    front: "Où démarre un programme Go ?"
    back: "Dans func main(), du package main."
    concept: go-program-structure
  - id: fc5
    front: "Peut-on importer une seule fonction d'un package ?"
    back: "Non. On importe toujours un package entier, puis on préfixe : fmt.Println."
    concept: go-program-structure
  - id: fc6
    front: "Un import inutilisé, c'est quoi en Go ?"
    back: "Une erreur de compilation."
    concept: go-program-structure
  - id: fc7
    front: "Que faut-il installer sur un serveur pour lancer un binaire Go ?"
    back: "Rien : c'est un binaire natif autonome."
    concept: go-build-binary
  - id: fc8
    front: "go build ou go run pour tester vite ?"
    back: "go run . compile dans un dossier temporaire et lance, sans laisser de binaire."
    concept: go-build-binary
