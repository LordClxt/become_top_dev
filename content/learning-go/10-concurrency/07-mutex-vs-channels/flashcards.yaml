cards:
- id: fc1
  front: Course de données ?
  back: 'Accès concurrents à une variable avec au moins une écriture, sans synchronisation : résultat imprévisible.'
  concept: go-data-race
- id: fc2
  front: Pourquoi counter++ n'est pas atomique ?
  back: 'Lire, ajouter 1, écrire : deux goroutines peuvent lire la même valeur et perdre une mise à jour.'
  concept: go-data-race
- id: fc3
  front: Détecter les courses ?
  back: go test -race ./... (ou go run -race).
  concept: go-data-race
- id: fc4
  front: Bonne forme d'un mutex ?
  back: Lock puis defer Unlock, section courte, mutex dans la struct, jamais copié.
  concept: go-mutex
- id: fc5
  front: Mutex réentrant ?
  back: 'Non : verrouiller deux fois dans la même goroutine = deadlock.'
  concept: go-mutex
- id: fc6
  front: RWMutex ?
  back: Plusieurs lecteurs OU un seul écrivain ; si les lectures dominent.
  concept: go-rwmutex
- id: fc7
  front: Slogan de Go ?
  back: Ne communique pas en partageant la mémoire ; partage la mémoire en communiquant.
  concept: go-share-by-communicating
- id: fc8
  front: Channel ou mutex ?
  back: 'Channel : transmettre données, coordonner. Mutex : protéger un état partagé.'
  concept: go-channels-vs-mutex
- id: fc9
  front: Fan-out / fan-in ?
  back: Répartir entre workers, puis fusionner les sorties (moniteur de fermeture).
  concept: go-pipeline
- id: fc10
  front: Atomiques ?
  back: 'sync/atomic : opérations indivisibles ; pour un compteur ou un drapeau simple (avancé).'
  concept: go-atomic
