criteria:
- id: correctness
  label: Correction (tests)
  weight: 0.5
  source: tests
- id: shutdown
  label: Arrêt propre et absence de fuite
  weight: 0.25
  source: ai
  levels:
    4: 'Chaque goroutine a une sortie claire : lecture de in et envoi du résultat gardés par ctx.Done(), fermeture unique par un moniteur, aucun
      envoi bloquant possible'
    2: Les cas courants sont corrects, mais un envoi ou une lecture peut rester bloqué dans un cas limite (annulation pendant l'envoi, lecteur
      parti)
    0: Fuites de goroutines, fermeture multiple ou sortie jamais fermée
- id: design
  label: Choix de conception
  weight: 0.1
  source: ai
  levels:
    4: Moniteur de fermeture, workers qui lisent le même channel d'entrée, pas de verrou inutile, erreurs transportées dans Result
    2: Fonctionne mais avec des verrous ou des tampons superflus
    0: Conception confuse ou état partagé sans protection
- id: readability
  label: Lisibilité
  weight: 0.15
  source: ai
  levels:
    4: Noms parlants, structure plate, commentaires qui expliquent pourquoi chaque select existe
    2: Lisible mais select imbriqués difficiles à suivre
    0: Difficile à suivre
