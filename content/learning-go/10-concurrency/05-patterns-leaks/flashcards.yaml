cards:
- id: fc1
  front: API et concurrence ?
  back: 'Un détail d''implémentation : pas de channels ni de mutex dans la signature, sauf si c''est le but.'
  concept: go-api-no-concurrency
- id: fc2
  front: Fuite de goroutine ?
  back: Goroutine qui ne se termine jamais (souvent bloquée sur un channel) ; le GC ne la libère pas.
  concept: go-goroutine-leak
- id: fc3
  front: Règle anti-fuite ?
  back: Chaque goroutine démarrée a une condition d'arrêt claire.
  concept: go-goroutine-leak
- id: fc4
  front: Annuler une goroutine ?
  back: select avec une case <-ctx.Done() ; l'appelant fait defer cancel().
  concept: go-context-cancel
- id: fc5
  front: Bon usage du tampon ?
  back: Nombre de goroutines connu, ou charge bornée.
  concept: go-buffer-choice
- id: fc6
  front: Mauvais usage du tampon ?
  back: Masquer un blocage dont on ignore la cause.
  concept: go-buffer-choice
- id: fc7
  front: Contre-pression ?
  back: Jetons dans un channel tamponné ; select + default refuse l'excédent (429).
  concept: go-backpressure
- id: fc8
  front: Pourquoi cap 1 dans timeLimit ?
  back: La goroutine peut écrire son résultat et se terminer même si le délai a expiré.
  concept: go-timeout-pattern
- id: fc9
  front: Limite d'un timeLimit ?
  back: 'Le travail continue en arrière-plan : on cesse de l''attendre, on ne l''arrête pas.'
  concept: go-timeout-pattern
