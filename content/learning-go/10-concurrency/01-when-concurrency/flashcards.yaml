cards:
- id: fc1
  front: Concurrence ?
  back: Structurer un programme en tâches indépendantes qui progressent sans s'attendre.
  concept: go-concurrency-vs-parallelism
- id: fc2
  front: Parallélisme ?
  back: Exécuter plusieurs tâches au même instant sur plusieurs cœurs.
  concept: go-concurrency-vs-parallelism
- id: fc3
  front: Qui décide si le code est parallèle ?
  back: Le runtime et le matériel ; le développeur écrit du code concurrent.
  concept: go-concurrency-vs-parallelism
- id: fc4
  front: Tâche liée aux E/S ?
  back: 'Elle passe son temps à attendre réseau ou disque : idéale pour la concurrence.'
  concept: go-when-concurrency
- id: fc5
  front: Quand la concurrence est inutile ?
  back: Chaque étape dépend de la précédente, ou le travail est minuscule.
  concept: go-when-concurrency
- id: fc6
  front: Loi d'Amdahl ?
  back: gain = 1 / ((1 − p) + p / n) ; plafond 1 / (1 − p).
  concept: go-amdahl
- id: fc7
  front: Plafond d'Amdahl pour p = 0,75 ?
  back: ×4, quel que soit le nombre de cœurs.
  concept: go-amdahl
- id: fc8
  front: Démarche recommandée ?
  back: Séquentiel correct → mesurer → concurrence ciblée → go test -race.
  concept: go-measure-first
