id: go-ch10-l01-quiz
questions:
- id: q1
  type: single
  prompt: Quelle phrase décrit le mieux la différence entre concurrence et parallélisme ?
  choices:
  - La concurrence structure des tâches indépendantes ; le parallélisme les exécute au même instant
  - Ce sont deux mots pour la même chose
  - Le parallélisme structure le code, la concurrence l'exécute
  - La concurrence exige plusieurs ordinateurs
  answer: 0
  explanation: La concurrence est une propriété de la conception, le parallélisme une propriété de l'exécution.
  concept: go-concurrency-vs-parallelism
  difficulty: 1
- id: q2
  type: single
  prompt: Un programme concurrent tourne sur un seul cœur. Que se passe-t-il ?
  choices:
  - Les tâches progressent à tour de rôle, sans jamais s'exécuter au même instant
  - Il refuse de démarrer
  - Il devient séquentiel et incorrect
  - Il utilise automatiquement un second cœur
  answer: 0
  explanation: Le planificateur alterne ; le programme reste correct.
  concept: go-concurrency-vs-parallelism
  difficulty: 1
- id: q3
  type: multiple
  prompt: Dans quels cas la concurrence apporte-t-elle un gain ?
  choices:
  - Appeler trois services indépendants qui attendent chacun le réseau
  - Traiter 1 000 images indépendantes
  - Calculer une suite où chaque valeur dépend de la précédente
  - Lire plusieurs fichiers indépendants
  answer:
  - 0
  - 1
  - 3
  explanation: Quand les tâches sont indépendantes et attendent ou se divisent. Une chaîne de dépendances n'a rien à faire en parallèle.
  concept: go-when-concurrency
  difficulty: 2
- id: q4
  type: single
  prompt: Avec p = 0,5 (moitié parallélisable), quel est le gain maximal, avec une infinité de cœurs ?
  choices:
  - ×2
  - ×1,5
  - ×4
  - Illimité
  answer: 0
  explanation: '1 / (1 − 0,5) = 2 : la moitié séquentielle borne le gain.'
  concept: go-amdahl
  difficulty: 2
- id: q5
  type: single
  prompt: Avec p = 0,75 et 3 cœurs, que vaut le gain (loi d'Amdahl) ?
  choices:
  - ×2
  - ×3
  - ×2,25
  - ×1,5
  answer: 0
  explanation: 1 / (0,25 + 0,75 / 3) = 1 / 0,5 = 2.
  concept: go-amdahl
  difficulty: 3
- id: q6
  type: single
  prompt: Quelle est la bonne démarche avec la concurrence ?
  choices:
  - Code séquentiel correct, mesure, puis concurrence là où ça rapporte
  - Tout en goroutines dès le départ
  - Ajouter des mutex jusqu'à ce que les bugs disparaissent
  - Utiliser le plus de cœurs possible
  answer: 0
  explanation: On mesure avant d'optimiser, et on vérifie avec -race après.
  concept: go-measure-first
  difficulty: 1
- id: q7
  type: single
  prompt: Pourquoi lancer une goroutine pour additionner deux entiers est-il une mauvaise idée ?
  choices:
  - Le coût de coordination dépasse largement le travail
  - Go l'interdit
  - Les goroutines ne savent pas additionner
  - Cela provoque toujours un deadlock
  answer: 0
  explanation: Création, synchronisation et regroupement coûtent plus cher que l'opération.
  concept: go-when-concurrency
  difficulty: 1
- id: q8
  type: single
  prompt: Un serveur web gère des milliers de requêtes qui attendent surtout une base de données. C'est un exemple de…
  choices:
  - Tâches liées aux E/S, idéales pour la concurrence
  - Calcul pur intensif
  - Programme purement séquentiel
  - Problème de précision des flottants
  answer: 0
  explanation: Pendant qu'une requête attend, d'autres avancent.
  concept: go-when-concurrency
  difficulty: 2
