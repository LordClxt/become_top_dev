intro: |
  Le monolithe compte ces modules (un import compte une fois) :

  | module | importe | A |
  |---|---|---|
  | bidding | auction, money, users | 0,2 |
  | auction | money, users | 0,5 |
  | video | auction | 0 |
  | money | — | 0 |
  | users | money | 0,25 |

  ```typescript
  class BidService {
    private bids: Bid[] = [];
    private highest = 0;
    private ffmpegPath = '/usr/bin/ffmpeg';
    private auditKey = 'k-…';

    place(b: Bid) { this.bids.push(b); this.highest = Math.max(this.highest, b.cents); }
    leader() { return this.bids.find((b) => b.cents === this.highest); }
    history() { return [...this.bids]; }
    transcode(file: string) { return run(this.ffmpegPath, file); }
    sign(b: Bid) { return hmac(this.auditKey, b); }
  }
  ```
