- id: pure
  type: choice
  title: Un LCOM trompeur
  prompt: |
    Un module `tax.ts` contient cinq **fonctions pures** sans aucun état : `vatRate(country)`, `vatAmount(net, country)`, `ecoTax(item)`, `roundCents(x)`, `totalWithTaxes(lines, country)`, qui s'appellent entre elles. Son LCOM compte 5 groupes. Que fais-tu ?
  options:
  - id: keep
    label: 'Rien : LCOM ne voit que les champs partagés ; ces fonctions servent un même calcul (cohésion fonctionnelle)'
  - id: split
    label: Cinq modules, un par fonction, pour obtenir un LCOM de 1
  - id: class
    label: Les mettre dans une classe avec un champ commun factice
