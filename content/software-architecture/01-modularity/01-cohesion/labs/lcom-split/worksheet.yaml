intro: |
  ```typescript
  class SubscriptionService {
    private plan = 'free';
    private renewsAt = new Date();
    private stripeKey = 'sk_live_…';
    private smtpHost = 'mail.local';

    upgrade(p: string) { this.plan = p; this.renewsAt = nextMonth(); }
    isActive() { return this.renewsAt > new Date(); }
    price() { return PRICES[this.plan]; }
    charge(cents: number) { return stripe(this.stripeKey, cents); }
    refund(id: string) { return stripeRefund(this.stripeKey, id); }
    sendInvoice(to: string) { return mail(this.smtpHost, to); }
    sendReminder(to: string) { return mail(this.smtpHost, to); }
  }
  ```
