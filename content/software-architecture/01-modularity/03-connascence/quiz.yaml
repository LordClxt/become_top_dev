id: arch-ch01-l03-quiz
questions:
  - id: q1
    type: single
    prompt: "`updateSeat('14D', 'Ford, N')` alors que la signature est `updateSeat(name, seat)`. Quelle connascence ?"
    choices:
      - "De nom"
      - "De type"
      - "De position"
      - "D'algorithme"
    answer: 2
    explanation: "Les types sont justes, l'ordre est faux : les deux côtés doivent s'accorder sur la position des valeurs."
    concept: arch-static-connascence
    difficulty: 1
  - id: q2
    type: single
    prompt: "Deux modules testent `status === 2`, l'un pour « payé », l'autre pour « expédié ». Quelle connascence ?"
    choices:
      - "De sens (convention)"
      - "D'identité"
      - "De timing"
      - "De nom"
    answer: 0
    explanation: "Ils doivent s'accorder sur la signification d'une valeur magique."
    concept: arch-static-connascence
    difficulty: 1
  - id: q3
    type: single
    prompt: "Quel refactoring transforme une connascence de sens en connascence de nom ?"
    choices:
      - "Ajouter un commentaire"
      - "Remplacer la valeur magique par une constante nommée (ou un type littéral)"
      - "Dupliquer la valeur dans chaque module"
      - "Passer en asynchrone"
    answer: 1
    explanation: "On remonte l'échelle de force : un nom se vérifie et se renomme avec les outils."
    concept: arch-connascence-rules
    difficulty: 1
  - id: q4
    type: code-output
    prompt: "Connascence d'exécution : qu'affiche ce programme ?"
    code: |
      class Email {
        to = ''; subject = ''; sent: string[] = [];
        send() { this.sent.push(`${this.to}:${this.subject || '(vide)'}`); }
      }
      const e = new Email();
      e.to = 'ana@example.com';
      e.send();
      e.subject = 'Facture';
      console.log(e.sent.join(','));
    answer: "ana@example.com:(vide)"
    explanation: "Le sujet est fixé après l'envoi : l'ordre d'exécution compte, sans que rien ne le vérifie."
    concept: arch-dynamic-connascence
    difficulty: 2
  - id: q5
    type: single
    prompt: "Une même valeur stockée dans trois bases doit être modifiée partout ou nulle part. Quelle connascence ?"
    choices:
      - "De valeurs"
      - "De nom"
      - "De position"
      - "D'exécution"
    answer: 0
    explanation: "Des valeurs liées qui doivent changer ensemble : en distribué, c'est le problème de la transaction répartie."
    concept: arch-dynamic-connascence
    difficulty: 2
  - id: q6
    type: single
    prompt: "Pourquoi préférer la connascence statique à la dynamique ?"
    choices:
      - "Elle est plus rapide à l'exécution"
      - "On la trouve par simple analyse du code, et les outils la refactorent facilement"
      - "Elle n'existe pas en TypeScript"
      - "Elle ne crée aucun couplage"
    answer: 1
    explanation: "La force mesure la difficulté de refactoring ; le statique est le plus facile."
    concept: arch-connascence-properties
    difficulty: 1
  - id: q7
    type: single
    prompt: "Une connascence de position entre deux fonctions privées du même fichier, et la même entre deux services : que dit la localité ?"
    choices:
      - "Les deux sont aussi graves"
      - "Celle entre services est bien plus grave"
      - "Celle du fichier est plus grave"
      - "La localité ne concerne que le dynamique"
    answer: 1
    explanation: "Une forme forte est tolérable de près, dangereuse de loin : force et localité se jugent ensemble."
    concept: arch-connascence-properties
    difficulty: 2
  - id: q8
    type: multiple
    prompt: "Lesquelles sont des règles de Page-Jones ?"
    choices:
      - "Minimiser la connascence globale en encapsulant"
      - "Minimiser la connascence qui traverse les frontières"
      - "Maximiser la connascence à l'intérieur des frontières"
      - "Supprimer toute connascence"
    answer: [0, 1, 2]
    explanation: "Zéro connascence est impossible : des éléments qui coopèrent sont forcément liés."
    concept: arch-connascence-rules
    difficulty: 2
  - id: q9
    type: single
    prompt: "Quelle question d'architecture la connascence des années 1990 ne traite-t-elle pas ?"
    choices:
      - "Comment nommer une fonction"
      - "Synchrone ou asynchrone entre services"
      - "L'ordre des paramètres"
      - "Les nombres magiques"
    answer: 1
    explanation: "C'est pourquoi le livre introduit plus loin les quanta d'architecture."
    concept: arch-connascence-limits
    difficulty: 1
