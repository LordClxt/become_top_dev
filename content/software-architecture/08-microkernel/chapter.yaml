id: arch-ch08
title: "Microkernel"
subtitle: "Un cœur minimal, des plug-ins indépendants, un registre et des contrats"
source: { chapter: 12, pages: "169-182" }
objectives:
  - "Décrire la topologie microkernel : système cœur (minimal ou chemin nominal) et plug-ins indépendants"
