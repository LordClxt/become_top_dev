  - "Choisir entre plug-ins à la compilation, à l'exécution et distants, et en mesurer les trade-offs"
  - "Concevoir le registre et des contrats standard, avec un adaptateur pour les plug-ins tiers ; garder les plug-ins hors de la base centrale"
