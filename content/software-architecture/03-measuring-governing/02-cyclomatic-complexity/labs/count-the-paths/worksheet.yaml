intro: |
  ```typescript
  // A
  function shipping(order: Order) {
    if (order.items.length === 0) return 0;
    let fee = 0;
    for (const it of order.items) fee += it.heavy ? 12 : 4;
    if (order.express || order.vip) fee *= 2;
    return fee;
  }

  // B
  function label(s: Status) {
    switch (s) {
      case 'created': return 'Créée';
      case 'paid': return 'Payée';
      case 'shipped': return 'Expédiée';
      case 'cancelled': return 'Annulée';
      default: return '?';
    }
  }

  // C
  async function fetchWithRetry(url: string, tries = 3) {
    let last: unknown;
    while (tries-- > 0) {
      try { return await fetch(url); }
      catch (e) { last = e; }
    }
    throw last ?? new Error('aucun essai');
  }
  ```
