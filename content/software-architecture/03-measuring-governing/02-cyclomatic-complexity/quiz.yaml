id: arch-ch03-l02-quiz
questions:
  - id: q1
    type: single
    prompt: "Quelle est la complexité cyclomatique d'une fonction sans aucune décision ?"
    choices: ["0", "1", "2", "Indéfinie"]
    answer: 1
    explanation: "Un seul chemin d'exécution."
    concept: arch-cc-definition
    difficulty: 1
  - id: q2
    type: single
    prompt: "Quelle est la CC de cette fonction ?"
    code: |
      function grade(score: number, bonus: boolean) {
        if (score > 90 || (score > 80 && bonus)) return 'A';
        else if (score > 50) return 'B';
        return 'C';
      }
    choices: ["2", "3", "4", "5"]
    answer: 3
    explanation: "if (+1), || (+1), && (+1), else if (+1) : 1 + 4 = 5."
    concept: arch-cc-definition
    difficulty: 2
  - id: q3
    type: single
    prompt: "Un graphe de flot connexe a 9 nœuds et 11 arêtes. Que vaut CC ?"
    choices: ["2", "3", "4", "20"]
    answer: 2
    explanation: "CC = E − N + 2 = 11 − 9 + 2 = 4."
    concept: arch-cc-formula
    difficulty: 1
  - id: q4
    type: single
    prompt: "On mesure trois fonctions séparées d'un coup : 30 nœuds, 34 arêtes, 3 composantes. CC totale ?"
    choices: ["6", "8", "10", "64"]
    answer: 2
    explanation: "CC = E − N + 2P = 34 − 30 + 6 = 10."
    concept: arch-cc-formula
    difficulty: 2
  - id: q5
    type: single
    prompt: "Quel seuil de CC les auteurs préfèrent-ils ?"
    choices: ["Moins de 5", "Moins de 10", "Moins de 50", "Moins de 800"]
    answer: 0
    explanation: "L'industrie accepte moins de 10 ; les auteurs trouvent ce seuil très haut."
    concept: arch-cc-thresholds
    difficulty: 1
  - id: q6
    type: single
    prompt: "D'après Crap4J, à partir de quelle CC aucune couverture ne sauve le code ?"
    choices: ["10", "20", "50", "800"]
    answer: 2
    explanation: "800, c'est le record de la fonction C de 4 000 lignes rencontrée par Neal Ford."
    concept: arch-cc-thresholds
    difficulty: 1
  - id: q7
    type: single
    prompt: "Que ne peut pas faire la complexité cyclomatique ?"
    choices:
      - "Compter les chemins"
      - "Distinguer la complexité du problème de celle du code"
      - "S'appliquer à une classe"
      - "Être automatisée"
    answer: 1
    explanation: "Essentielle ou accidentelle : c'est à l'humain d'interpréter."
    concept: arch-cc-essential-accidental
    difficulty: 1
  - id: q8
    type: single
    prompt: "Pourquoi le TDD réduit-il la complexité cyclomatique en moyenne ?"
    choices:
      - "Il interdit les if"
      - "Écrire un petit test puis le minimum de code produit des méthodes petites et cohésives"
      - "Il supprime les boucles"
      - "Il ne la réduit pas"
    answer: 1
    explanation: "Un effet secondaire, mais constant."
    concept: arch-cc-essential-accidental
    difficulty: 1
