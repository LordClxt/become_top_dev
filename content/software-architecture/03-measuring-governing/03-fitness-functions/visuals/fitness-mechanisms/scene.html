<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta name="visual-id" content="arch-ch03-fitness-mechanisms" />
    <title>Où tournent les fitness functions</title>
    <!--
      Choreography (12 s) :
        0.0 – 2.0  la frise commit → production
        2.0 – 8.5  chaque mécanisme se place
        8.5 – 12   plus tôt, moins cher
    -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0c0d12; --surface: #15161e; --surface-2: #1d1f2b; --line: #2b2e40;
        --text: #f4f4ef; --muted: #a3a5b8; --accent: #d6ff3d; --pass: #5be49b; --fail: #e3a93c;
      }
      html.light {
        --ink: #f3f2ec; --surface: #ffffff; --surface-2: #e9e8e0; --line: #d9d7cc;
        --text: #0c0d12; --muted: #5b5d6e; --accent: #3a3dff; --pass: #1f8a50; --fail: #a86b00;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: var(--text);
        font-family: "Schibsted Grotesk", system-ui, sans-serif; }
      #root { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
      .caption { position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-size: 50px; font-weight: 700; opacity: 0; }
      .caption em { font-style: normal; color: var(--accent); }
      .card { position: absolute; border-radius: 24px; border: 4px solid var(--line); background: var(--surface);
        padding: 18px 26px; opacity: 0; }
      .card .t { font-size: 36px; font-weight: 600; }
      .card .d { font-size: 26px; color: var(--muted); margin-top: 4px; }
      .pass { border-color: var(--pass); } .fail { border-color: var(--fail); } .acc { border-color: var(--accent); }
      .tag { position: absolute; font-size: 30px; opacity: 0; }
      .tag.pass { color: var(--pass); } .tag.fail { color: var(--fail); } .tag.acc { color: var(--accent); }
      svg.lines { position: absolute; inset: 0; overflow: visible; }
      svg.lines line, svg.lines path { fill: none; stroke: var(--line); stroke-width: 5; stroke-linecap: round; opacity: 0; }
      svg.lines .dash { stroke-dasharray: 14 12; }
      .dot { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); opacity: 0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="caption" id="c1">Chaque fitness function tourne <em>là où sa caractéristique se voit</em></div>
      <div class="caption" id="c2">Plus tôt et plus souvent = <em>dérive moins chère</em></div>
      <svg class="lines" width="1920" height="1080"><line id="axis" x1="160" y1="300" x2="1760" y2="300" /></svg>
      <div class="tag acc mono" id="st0" style="left:180px;top:220px">commit</div>
      <div class="tag acc mono" id="st1" style="left:600px;top:220px">CI</div>
      <div class="tag acc mono" id="st2" style="left:1020px;top:220px">build</div>
      <div class="tag acc mono" id="st3" style="left:1440px;top:220px">production</div>
      <div class="card pass" id="m1" style="left:150px;top:400px;width:380px;min-height:140px"><div class="t mono">test d’architecture</div><div class="d">couches, cycles</div></div>
      <div class="card pass" id="m2" style="left:570px;top:400px;width:380px;min-height:140px"><div class="t mono">métrique + seuil</div><div class="d">CC < 10, distance</div></div>
      <div class="card pass" id="m3" style="left:990px;top:400px;width:380px;min-height:140px"><div class="t mono">budget de taille</div><div class="d">< 200 Ko de JS</div></div>
      <div class="card pass" id="m4" style="left:1410px;top:400px;width:380px;min-height:140px"><div class="t mono">moniteur</div><div class="d">p99 < 300 ms</div></div>
      <div class="card pass" id="m5" style="left:1410px;top:600px;width:380px;min-height:140px"><div class="t mono">chaos engineering</div><div class="d">Chaos Monkey</div></div>
    </div>
    <script>
      const DURATION = 12;
      const tl = gsap.timeline({ paused: true });
      function captions(list) {
        for (const [sel, a, b] of list) {
          tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, a);
          if (b < DURATION) tl.to(sel, { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, b - 0.25);
        }
      }
      function show(sel, t, d = 0.4) {
        tl.fromTo(sel, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: d, stagger: 0.08, ease: "power3.out", immediateRender: false }, t);
      }
      function fade(sel, t, to = 1) { tl.to(sel, { opacity: to, duration: 0.35 }, t); }
      function hide(sel, t) { tl.to(sel, { opacity: 0, duration: 0.25 }, t); }
      function pulse(sel, t) {
        tl.fromTo(sel, { scale: 1 }, { keyframes: { scale: [1, 1.07, 1] }, duration: 0.45, ease: "none", immediateRender: false }, t);
      }
      function color(sel, c, t) { tl.to(sel, { borderColor: c, duration: 0.3 }, t); }
      function stroke(sel, c, t) { tl.to(sel, { stroke: c, duration: 0.3 }, t); }
      function travel(sel, x1, y1, x2, y2, t, d = 0.8) {
        tl.fromTo(sel, { left: x1, top: y1, opacity: 1 }, { left: x2, top: y2, duration: d, ease: "power1.inOut", immediateRender: false }, t);
        tl.to(sel, { opacity: 0, duration: 0.15 }, t + d);
      }
      const ACC = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      const PASS = getComputedStyle(document.documentElement).getPropertyValue("--pass").trim();
      const FAIL = getComputedStyle(document.documentElement).getPropertyValue("--fail").trim();
      captions([["#c1", 0.3, 8.4], ["#c2", 8.6, DURATION + 1]]);
      fade("#axis", 0.2); show("[id^=st]", 0.6);
      show("#m1", 2.2); show("#m2", 3.6); show("#m3", 5.0); show("#m4", 6.4); show("#m5", 7.6);
      pulse("#m1,#m2", 9.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
