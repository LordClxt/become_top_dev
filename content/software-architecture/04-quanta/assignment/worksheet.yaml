intro: |
  Services : **Devis**, **Suivi**, **Réception**, **Évaluation**, **Recyclage**, **Comptabilité**. Les clients utilisent Devis et Suivi ; les opérateurs internes, les quatre autres.

  - **Version 1** : une seule interface web pour tout le monde, une seule base, les six services déployés séparément.
  - **Version 2** : deux interfaces (clients ; opérateurs), mais toujours une seule base.
  - **Version 3** : deux interfaces et deux bases : une base « externe » (Devis, Suivi) dans une zone réseau exposée, une base « interne » (les quatre autres) ; la base interne alimente la base externe en asynchrone pour le statut des appareils.
