justification: "Une séquence de 14 s à regarder : une requête traverse les filtres, entre dans la DispatcherServlet, passe par le HandlerMapping (qui renvoie la méthode et ses intercepteurs), l'adaptateur (arguments, appel, écriture du corps), puis ressort ; une seconde passe montre une exception qui part vers les résolveurs, puis vers /error."
