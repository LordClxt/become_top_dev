id: spring-ch01-l01-quiz
questions:
  - id: q1
    type: code-output
    prompt: "Qu'affiche ce programme ? (On ne garde que les noms sans point, pour masquer les beans internes de Spring.)"
    code: |
      import org.springframework.context.annotation.*;
      import org.springframework.stereotype.Component;
      import java.util.Arrays;

      public class Main {
          public static void main(String[] args) {
              var ctx = new AnnotationConfigApplicationContext(Config.class, PriceCalculator.class);
              System.out.println(Arrays.stream(ctx.getBeanDefinitionNames())
                      .filter(n -> !n.contains(".")).sorted().toList());
              ctx.close();
          }
      }

      class Catalog { }

      @Component
      class PriceCalculator { }

      @Configuration
      class Config {
          @Bean Catalog mainCatalog() { return new Catalog(); }
      }
    answer: "[config, mainCatalog, priceCalculator]"
    explanation: "Une méthode @Bean donne son nom au bean (mainCatalog, pas catalog), une classe enregistrée prend son nom simple en camelCase (priceCalculator). La classe de configuration est elle-même un bean (config)."
    concept: spring-bean-naming
    difficulty: 2
  - id: q2
    type: single
    prompt: "Qui transforme les méthodes `@Bean` d'une classe `@Configuration` en définitions de beans ?"
    choices:
      - "Le compilateur Java, grâce à un processeur d'annotations"
      - "ConfigurationClassPostProcessor, un BeanFactoryPostProcessor enregistré par le conteneur"
      - "AutowiredAnnotationBeanPostProcessor, au moment de créer chaque bean"
      - "Le constructeur de AnnotationConfigApplicationContext, avant refresh()"
    answer: 1
    explanation: "Spring lit les annotations à l'exécution, pas à la compilation. Ce travail se fait au temps 1 de refresh(), par un BeanFactoryPostProcessor : le conteneur se sert de ses propres points d'extension. AutowiredAnnotationBeanPostProcessor, lui, agit plus tard, sur des objets déjà créés."
    concept: spring-refresh
    difficulty: 2
  - id: q3
    type: single
    prompt: "Pendant `refresh()`, à quel moment les singletons non lazy de l'application sont-ils créés ?"
    choices:
      - "Avant les BeanFactoryPostProcessor, pour qu'ils puissent les modifier"
      - "Après les BeanFactoryPostProcessor et l'enregistrement des BeanPostProcessor"
      - "Au premier appel de getBean, comme des prototypes"
      - "Après la publication de ContextRefreshedEvent"
    answer: 1
    explanation: "Les définitions doivent être définitives avant de créer quoi que ce soit (temps 1), et les BeanPostProcessor doivent être prêts pour voir passer chaque bean. Seulement ensuite, finishBeanFactoryInitialization crée les singletons. ContextRefreshedEvent annonce la fin."
    concept: spring-refresh
    difficulty: 2
  - id: q4
    type: code-output
    prompt: "La création de `Payment` échoue. Qu'affiche le programme ?"
    code: |
      import org.springframework.context.annotation.*;
      import jakarta.annotation.PreDestroy;

      public class Main {
          static class Pool { @PreDestroy void close() { System.out.println("pool fermé"); } }
          static class Payment { Payment(Pool pool) { throw new IllegalStateException("clé API absente"); } }

          @Configuration
          static class Config {
              @Bean Pool pool() { return new Pool(); }
              @Bean Payment payment(Pool pool) { return new Payment(pool); }
          }

          public static void main(String[] args) {
              try {
                  new AnnotationConfigApplicationContext(Config.class);
              } catch (Exception e) {
                  System.out.println("démarrage refusé");
              }
          }
      }
    answer: "pool fermé\ndémarrage refusé"
    explanation: "Le pool avait déjà été créé quand Payment a échoué. Le catch de refresh() appelle destroyBeans() avant de propager l'exception : les beans déjà créés reçoivent leur callback de destruction. Un démarrage raté ne laisse pas de ressources ouvertes."
    concept: spring-fail-fast
    difficulty: 3
  - id: q5
    type: multiple
    prompt: "Quelles affirmations sur une BeanDefinition sont vraies ?"
    choices:
      - "Elle décrit comment fabriquer un bean : sa classe ou la méthode @Bean à appeler"
      - "Elle porte la portée du bean (singleton, prototype…) et son caractère lazy"
      - "Elle est créée au moment où le bean est instancié"
      - "Un BeanFactoryPostProcessor peut la modifier avant que le bean existe"
    answer: [0, 1, 3]
    explanation: "La définition existe bien avant l'objet : c'est ce qui permet de vérifier, de transformer ou de retirer des recettes au temps 1. Elle n'est pas créée à l'instanciation, c'est l'inverse : l'objet est créé à partir d'elle."
    concept: spring-bean-definition
    difficulty: 2
  - id: q6
    type: single
    prompt: "Un collègue propose de passer `spring.main.lazy-initialization=true` en production pour gagner 3 secondes de démarrage. Quel est le vrai risque ?"
    choices:
      - "Aucun : les beans sont identiques, seulement créés plus tard"
      - "Les beans deviennent des prototypes"
      - "Un bean mal configuré n'échoue plus au démarrage mais à sa première utilisation, parfois chez un client"
      - "L'application consomme toujours moins de mémoire, ce qui fausse les alertes"
    answer: 2
    explanation: "Les beans restent des singletons, mais la vérification collective du démarrage disparaît : l'erreur se déplace vers la première requête qui touche le bean. Et la mémoire n'est pas économisée : il faut quand même pouvoir créer tous les beans plus tard."
    concept: spring-fail-fast
    difficulty: 2
