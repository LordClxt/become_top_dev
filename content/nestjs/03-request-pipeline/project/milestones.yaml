milestones:
  - id: m1
    title: "Le contexte sans contagion"
    goal: "Un middleware ouvre un contexte AsyncLocalStorage par requête (x-request-id reçu, sinon req_<n>, renvoyé en en-tête) ; RequestContext devient un singleton ; plus aucun provider Scope.REQUEST."
    tests: "nesttest M1"
    review: false
  - id: m2
    title: "Les écritures réservées"
    goal: "@Staff() sur POST et DELETE /books ; un guard global exige x-api-key === STAFF_KEY, sinon 401 INVALID_KEY ; lectures et commandes restent publiques."
    tests: "nesttest M2"
    review: false
  - id: m3
    title: "Des erreurs traçables"
    goal: "Un filtre global renvoie { statusCode, errorCode, message, requestId } pour toutes les erreurs (y compris validation et routeur) ; un intercepteur pose x-response-time-ms sur les succès."
    tests: "nesttest M3"
    review: true
