  - "Extraire et convertir paramètres, query et corps, et valider un corps avec un schéma Standard Schema"
  - "Prévoir l'ordre de résolution des routes, détecter les routes masquées et les doublons avec routeConflictPolicy"
  - "Versionner une API et organiser ses préfixes sans casser les sondes de santé"
mastery_threshold: 0.8
