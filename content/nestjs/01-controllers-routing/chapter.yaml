id: nest-ch01
title: "Contrôleurs et routage"
subtitle: "Routes, réponses, paramètres, conflits de routes, versioning et préfixes"
source: { chapter: 3, pages: "/controllers", url: "https://docs.nestjs.com/controllers" }
objectives:
  - "Concevoir les routes d'une ressource REST avec les bons verbes et les bons codes de statut (201, 204, 404…)"
