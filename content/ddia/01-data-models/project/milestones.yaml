milestones:
  - id: m1
    title: "Stocker sans partager la mémoire"
    goal: "put estampille la version courante, putRaw charge des données anciennes, raw/delete/size, avec des copies profondes dans les deux sens."
    tests: "tstest M1"
    review: false
  - id: m2
    title: "Schema-on-read"
    goal: "get met un ancien document à niveau en appliquant les Upgrader dans l'ordre, sans toucher au stockage, avec des erreurs claires (introuvable, version future, upgrader en échec)."
    tests: "tstest M2"
    review: false
  - id: m3
    title: "Chercher et migrer"
    goal: "find par chemin pointé à travers les versions, pendingMigration et migrate qui réécrit le stockage et s'arrête au premier échec."
    tests: "tstest M3"
    review: true
    prompt: "Quand choisirais-tu la mise à niveau à la lecture (lazy) plutôt que migrate (eager) pour une vraie base ? Donne un argument de coût et un de risque."
