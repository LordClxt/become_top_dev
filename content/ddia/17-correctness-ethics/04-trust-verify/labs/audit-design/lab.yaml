- type: restore
  component: cron
  label: Test de restauration
  hint: Restaure régulièrement une sauvegarde pour prouver qu'elle marche.
- type: inplace
  component: mysql
  label: Table de soldes mise à jour en place
  hint: Des UPDATE directs, sans événement conservé.
