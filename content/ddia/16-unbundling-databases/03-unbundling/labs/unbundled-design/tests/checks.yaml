checks:
- id: write
  label: Le service écrit dans le système de référence
  rule: edge_kind
  source: app
  target: db
  kind: write
- id: cdc
  label: La base publie ses changements dans le log, de façon asynchrone
  rule: edge_kind
  source: db
  target: log
  kind: async
- id: to-indexer
  label: L'indexeur consomme le log
  rule: edge_kind
  source: log
  target: indexer
  kind: async
- id: to-search
  label: L'indexeur écrit dans l'index de recherche
  rule: edge_kind
  source: indexer
  target: search
  kind: write
- id: to-cacher
  label: Le mainteneur de cache consomme le même log
  rule: edge_kind
  source: log
  target: cacher
  kind: async
- id: to-cache
  label: Le mainteneur de cache écrit dans le cache
  rule: edge_kind
  source: cacher
  target: cache
  kind: write
- id: no-dual-search
  label: 'Pas de double écriture : le service n''écrit pas dans l''index'
  rule: no_edge
  source: app
  target: search
- id: no-dual-cache
  label: Le service n'écrit pas non plus dans le cache
  rule: no_edge
  source: app
  target: cache
- id: search-owner
  label: Tout ce qui entre dans l'index vient de l'indexeur
  rule: inbound_via
  target: search
  via: indexer
- id: bootstrap
  label: L'indexeur part de l'instantané initial avant de suivre le log
  rule: edge_kind
  source: snapshot
  target: indexer
  kind: read
- id: cache-role
  label: Le Redis joue le rôle de cache
  rule: prop
  source: cache
  prop: role
  value: cache
- id: no-xa
  label: Pas de transaction distribuée entre systèmes hétérogènes
  rule: count
  source: xa
  max: 0
- id: alone
  label: Aucun bloc isolé
  rule: connected
