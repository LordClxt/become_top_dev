intro: |2

  Ton équipe dit : « Notre test de charge est au vert, mais les utilisateurs se plaignent. » Tu rejoues à la main un **serveur unique** qui traite les requêtes **dans l'ordre d'arrivée** (FIFO). Cinq requêtes arrivent :

  | Requête | Arrivée (ms) | Durée de service (ms) |
  |---|---|---|
  | 1 | 0 | 10 |
  | 2 | 2 | 1 |
  | 3 | 4 | 1 |
  | 4 | 6 | 1 |
  | 5 | 8 | 1 |

  Une requête démarre à `max(arrivée, instant où le serveur se libère)`. Son temps de réponse est `fin − arrivée`.
blocks:
- id: trace
  type: table
  title: Rejouer la file
  prompt: Complète le début, la fin et le temps de réponse de chaque requête, en millisecondes.
  columns:
  - id: start
    label: Début
  - id: end
    label: Fin
  - id: resp
    label: Réponse
  rows:
  - id: r1
    label: Requête 1
  - id: r2
    label: Requête 2
  - id: r3
    label: Requête 3
  - id: r4
    label: Requête 4
  - id: r5
    label: Requête 5
- id: moy
  type: table
  title: Deux façons de mesurer
  prompt: '**Boucle ouverte** : les requêtes arrivent aux heures ci-dessus. **Boucle fermée** : un client envoie la suivante seulement quand il
    a reçu la réponse, donc il ne voit jamais de file (temps de réponse = temps de service). Moyenne et médiane (rang `⌈0,5 × 5⌉`), avec une décimale.'
  columns:
  - id: mean
    label: Moyenne (ms)
  - id: p50
    label: Médiane (ms)
  rows:
  - id: open
    label: Boucle ouverte
  - id: closed
    label: Boucle fermée
- id: why
  type: choice
  title: Pourquoi le test de charge était au vert
  prompt: Le test de charge utilisait des clients en boucle fermée. Que s'est-il passé ?
  options:
  - id: hol
    label: 'La requête lente n''a jamais fait attendre les suivantes dans la mesure : le blocage en tête de file a disparu des chiffres'
    hint: Head-of-line blocking
  - id: cpu
    label: Le test consommait moins de CPU que la production
  - id: avg
    label: Le test calculait un percentile, la production une moyenne
- id: slo
  type: choice
  title: Quel objectif est dépassé ?
  prompt: L'objectif de service demande **p50 ≤ 5 ms** et **p99 ≤ 12 ms** (rang `⌈p × n⌉`). En boucle ouverte, lequel est **strictement dépassé**
    ?
  options:
  - id: p50
    label: Seulement le p50
  - id: p99
    label: Seulement le p99
  - id: both
    label: Les deux
  - id: none
    label: Aucun
- id: budget
  type: number
  title: Le budget d'erreur
  prompt: L'objectif de disponibilité est **99,9 %** sur **30 jours**. Combien de minutes d'indisponibilité le budget d'erreur autorise-t-il ?
  unit: min
- id: reste
  type: number
  title: Ce qu'il reste après un incident
  prompt: Une panne de **25 minutes** a déjà eu lieu ce mois-ci. Combien de minutes de budget reste-t-il ?
  unit: min
- id: charge
  type: tuner
  title: Combien de serveurs pour la charge ?
  prompt: 'Le pic est de **100 requêtes/s**, chacune dure **40 ms** de service : `ρ = 100 × 0,04 / serveurs`. Plus ρ approche de 1, plus la file
    explose : l''attente relative vaut environ `ρ / (1 − ρ)`. Vise **moins de 70 %** d''utilisation et une attente relative **sous 2,5**, sans
    dépasser **6 serveurs**.'
  params:
  - id: c
    label: Serveurs
    unit: ''
    min: 1
    max: 12
    step: 1
    default: 4
  metrics:
  - id: rho
    label: Utilisation ρ
    expr: 4 / c
    format: percent
  - id: wait
    label: Attente relative
    expr: (4 / c) / (1 - 4 / c)
    format: number
  goals:
  - id: util
    label: Moins de 70 % d'utilisation
    expr: rho < 0.7
  - id: att
    label: Attente relative sous 2,5
    expr: wait >= 0 && wait < 2.5
  - id: cost
    label: Au plus 6 serveurs
    expr: c <= 6
