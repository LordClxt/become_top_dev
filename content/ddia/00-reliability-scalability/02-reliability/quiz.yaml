id: ddia-ch00-l02-quiz
questions:
  - id: q1
    type: single
    prompt: "Quelle phrase distingue correctement une faute d'une panne ?"
    choices:
      - "Une faute est une panne de courte durée"
      - "Une faute est un composant qui s'écarte de sa spécification ; une panne est le système entier qui cesse de fournir le service"
      - "Une faute concerne le logiciel, une panne le matériel"
      - "Les deux mots sont synonymes"
    answer: 1
    explanation: "On cherche à concevoir des mécanismes qui empêchent les fautes de provoquer des pannes."
    concept: ddia-fault-vs-failure
    difficulty: 1
  - id: q2
    type: single
    prompt: "Pourquoi peut-il être judicieux de tuer des processus au hasard dans un système en production (Chaos Monkey) ?"
    choices:
      - "Pour libérer de la mémoire"
      - "Pour exercer en permanence les mécanismes de tolérance aux fautes et vérifier qu'ils marchent, avant qu'une vraie faute n'arrive"
      - "Pour réduire la facture du cloud"
      - "Pour tester la sécurité du réseau"
    answer: 1
    explanation: "Beaucoup de bugs critiques viennent d'une mauvaise gestion d'erreur. Provoquer les fautes teste cette gestion en continu."
    concept: ddia-fault-vs-failure
    difficulty: 2
  - id: q3
    type: single
    prompt: "Un cluster compte 10 000 disques de MTTF 30 ans. Environ combien de disques s'attend-on à voir mourir par jour ?"
    choices: ["Un tous les 100 jours", "Environ un", "Environ dix", "Aucun"]
    answer: 1
    explanation: "10 000 / (30 × 365) ≈ 0,9 disque par jour. À grande échelle, les pannes de disque sont un événement quotidien."
    concept: ddia-hardware-faults
    difficulty: 1
  - id: q4
    type: single
    prompt: "Pourquoi un système tolérant à la perte de machines entières est-il plus simple à mettre à jour ?"
    choices:
      - "Parce qu'il n'a pas besoin de mises à jour"
      - "Parce qu'on peut le mettre à jour nœud par nœud, sans arrêter le système dans son ensemble (rolling upgrade)"
      - "Parce qu'il tourne sans système d'exploitation"
      - "Parce qu'il n'utilise que du matériel neuf"
    answer: 1
    explanation: "Un système mono-serveur impose un arrêt planifié pour redémarrer. Avec plusieurs nœuds et une tolérance logicielle, on met à jour un nœud à la fois."
    concept: ddia-hardware-faults
    difficulty: 2
  - id: q5
    type: single
    prompt: "Quelle différence fondamentale entre les pannes matérielles et les erreurs logicielles systématiques ?"
    choices:
      - "Les erreurs logicielles sont toujours plus rares"
      - "Les pannes matérielles sont plutôt aléatoires et indépendantes ; les erreurs logicielles sont corrélées entre les nœuds et causent plus de pannes d'ensemble"
      - "Les pannes matérielles sont toujours systématiques"
      - "Il n'y en a aucune"
    answer: 1
    explanation: "Un même bug planté sur tous les serveurs frappe tous les nœuds en même temps, ce qui rend la redondance inutile."
    concept: ddia-software-faults
    difficulty: 2
  - id: q11
    type: multiple
    prompt: "Lesquels de ces événements sont des fautes logicielles systématiques ?"
    choices:
      - "Un bug qui fait planter toutes les instances sur une entrée précise"
      - "Un disque dur qui meurt"
      - "Un processus qui épuise la mémoire partagée"
      - "Une panne de courant dans un rack"
      - "Une dépendance qui se met à renvoyer des réponses corrompues"
    answer: [0, 2, 4]
    explanation: "Les trois premières sont des erreurs de logiciel ou de dépendance, souvent corrélées entre nœuds. Le disque et le courant sont des fautes matérielles."
    concept: ddia-software-faults
    difficulty: 2
  - id: q6
    type: single
    prompt: "Selon l'étude citée, quelle est la première cause de pannes des grands services internet ?"
    choices:
      - "Les pannes réseau"
      - "Les erreurs de configuration des opérateurs"
      - "Les pannes de disque"
      - "Les attaques par déni de service"
    answer: 1
    explanation: "Les erreurs de configuration arrivent en tête ; les pannes matérielles n'interviennent que dans 10 à 25 % des cas."
    concept: ddia-human-errors
    difficulty: 1
  - id: q7
    type: multiple
    prompt: "Lesquelles de ces pratiques réduisent l'impact des erreurs humaines ?"
    choices:
      - "Un environnement bac à sable complet avec des données réelles"
      - "Un retour arrière rapide des changements de configuration"
      - "Supprimer toute la documentation pour éviter les confusions"
      - "Un déploiement progressif du code"
      - "Une télémétrie détaillée (métriques, taux d'erreur)"
    answer: [0, 1, 3, 4]
    explanation: "Bac à sable, retour arrière, déploiement progressif et télémétrie limitent la portée d'une erreur et accélèrent le diagnostic."
    concept: ddia-human-errors
    difficulty: 1
  - id: q8
    type: single
    prompt: "Trois services à 99,9 % de disponibilité sont tous nécessaires pour répondre à une requête. Quelle est la disponibilité de l'ensemble, environ ?"
    choices: ["99,9 %", "99,7 %", "99,99 %", "100 %"]
    answer: 1
    explanation: "Composants en série : on multiplie. 0,999³ ≈ 0,997, soit 99,7 %."
    concept: ddia-availability-math
    difficulty: 2
  - id: q9
    type: single
    prompt: "Deux serveurs indépendants, chacun disponible 90 % du temps, peuvent chacun servir la requête (un seul suffit). Disponibilité de l'ensemble ?"
    choices: ["90 %", "95 %", "99 %", "81 %"]
    answer: 2
    explanation: "En parallèle : 1 − (0,1 × 0,1) = 0,99. Mais cette formule suppose que les pannes sont indépendantes."
    concept: ddia-availability-math
    difficulty: 2
  - id: q10
    type: single
    prompt: "Pourquoi la formule de la disponibilité en parallèle peut-elle être trop optimiste pour du logiciel ?"
    choices:
      - "Parce que le logiciel est toujours plus lent"
      - "Parce qu'elle suppose des pannes indépendantes, alors que deux instances du même logiciel partagent les mêmes bugs et la même configuration"
      - "Parce que la formule est fausse en mathématiques"
      - "Parce que le logiciel n'a pas de disponibilité"
    answer: 1
    explanation: "Une faute commune (bug, mauvaise configuration) frappe tous les nœuds à la fois : la probabilité de panne simultanée est bien plus grande que le produit des probabilités individuelles."
    concept: ddia-availability-math
    difficulty: 3
