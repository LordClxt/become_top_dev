<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta name="visual-id" content="ddia-ch00-tail-amplification" />
    <title>Amplification de la latence de queue</title>
    <!--
      Choreography (11 s) :
        0.8 – 2.8   n = 1 : 1 % de requêtes touchées
        3.4 – 5.0   n = 10 : 9,6 %
        5.4 – 8.0   n = 100 : 63 %
      Le pourcentage est calculé : 1 − 0,99^n.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0c0d12; --surface: #15161e; --surface-2: #1d1f2b; --line: #2b2e40;
        --text: #f4f4ef; --muted: #a3a5b8; --accent: #d6ff3d; --pass: #5be49b; --fail: #e3a93c;
      }
      html.light {
        --ink: #f3f2ec; --surface: #ffffff; --surface-2: #e9e8e0; --line: #d9d7cc;
        --text: #0c0d12; --muted: #5b5d6e; --accent: #3a3dff; --pass: #1f8a50; --fail: #a86b00;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: var(--text);
        font-family: "Schibsted Grotesk", system-ui, sans-serif; }
      #root { position: absolute; inset: 0; }
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
      .caption { position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-size: 50px; font-weight: 700; opacity: 0; }
      .caption em { font-style: normal; color: var(--accent); }
      .card { position: absolute; border-radius: 24px; border: 4px solid var(--line); background: var(--surface);
        padding: 20px 30px; will-change: transform; opacity: 0; }
      .card .t { font-size: 44px; font-weight: 600; }
      .card .d { font-size: 30px; color: var(--muted); margin-top: 4px; }
      svg.lines { position: absolute; inset: 0; overflow: visible; }
      svg.lines path, svg.lines line { fill: none; stroke: var(--line); stroke-width: 5; stroke-linecap: round; }

      .rowc { position: absolute; left: 0; width: 1920px; height: 200px; opacity: 0; }
      .nl { position: absolute; left: 110px; top: 70px; font-size: 56px; font-weight: 600; }
      .dots { position: absolute; left: 430px; top: 0; height: 200px; display: flex; flex-wrap: wrap; align-content: center; gap: 14px; }
      .dots i { display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
      .dots i.slow { background: var(--fail); box-shadow: 0 0 0 5px color-mix(in srgb, var(--fail) 35%, transparent); }
      .track { position: absolute; left: 1090px; top: 70px; width: 640px; height: 60px; border-radius: 14px; background: var(--surface); border: 4px solid var(--line); overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fail); }
      .fin { position: absolute; left: 0; top: 0; opacity: 0; }
      .pct { position: absolute; left: 1750px; top: 62px; font-size: 52px; font-weight: 700; color: var(--fail); white-space: nowrap; }
      #r1 { top: 230px; } #r2 { top: 450px; } #r3 { top: 690px; }
      .colh { position: absolute; top: 175px; font-size: 30px; color: var(--muted); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.0" data-width="1920" data-height="1080">

      <div class="caption" id="c1">Chaque appel a <em>1 %</em> de chances d'être lent</div>
      <div class="caption" id="c2">Une requête est lente dès qu'<em>un seul</em> de ses n appels l'est</div>
      <div class="caption" id="c3">À 100 appels : <em>63 %</em> des requêtes sont touchées</div>
      <div class="colh mono" style="left:430px">appels backend d'une requête</div>
      <div class="colh mono" style="left:1090px">requêtes touchées par un appel lent</div>
      <div class="rowc" id="r1"><div class="nl mono">n = 1</div><div class="dots" id="d1" data-n="1"></div>
        <div class="track"><div class="fill" id="f1"></div></div><div class="pct mono" id="p1"><span class="live"><span id="n1">0</span> %</span><span class="fin" id="x1">9,6 %</span></div></div><div class="rowc" id="r2"><div class="nl mono">n = 10</div><div class="dots" id="d2" data-n="10"></div>
        <div class="track"><div class="fill" id="f2"></div></div><div class="pct mono" id="p2"><span class="live"><span id="n2">0</span> %</span><span class="fin" id="x2">9,6 %</span></div></div><div class="rowc" id="r3"><div class="nl mono">n = 100</div><div class="dots" id="d3" data-n="100"></div>
        <div class="track"><div class="fill" id="f3"></div></div><div class="pct mono" id="p3"><span class="live"><span id="n3">0</span> %</span><span class="fin" id="x3">9,6 %</span></div></div>

    </div>
    <script>
      const DURATION = 11.0;
      const tl = gsap.timeline({ paused: true });
      // Légendes : apparaissent/disparaissent aux instants indiqués.
      function captions(list) {
        for (const [sel, a, b] of list) {
          tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, a);
          if (b < DURATION) tl.to(sel, { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, b - 0.25);
        }
      }

      captions([["#c1", 0.4, 2.8], ["#c2", 3.0, 7.0], ["#c3", 7.2, DURATION + 1]]);
      // Points (appels) construits une fois ; l'appel lent est à un indice fixe.
      const SLOW_AT = { d1: 0, d2: 6, d3: 37 };
      for (const id of ["d1", "d2", "d3"]) {
        const box = document.getElementById(id), n = +box.dataset.n;
        box.style.width = (n === 100 ? 20 * 30 : n * 30) + "px";
        for (let k = 0; k < n; k++) { const i = document.createElement("i"); if (k === SLOW_AT[id]) i.className = "slow"; box.appendChild(i); }
      }
      // Pourcentage exact : 1 − 0,99^n (largeur de barre sur 632 px intérieurs).
      const ROWS = [["1", 0.8, 0.01], ["2", 3.4, 1 - Math.pow(0.99, 10)], ["3", 5.4, 1 - Math.pow(0.99, 100)]];
      for (const [k, t, p] of ROWS) {
        tl.fromTo("#r" + k, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo("#f" + k, { width: 0 }, { width: Math.round(632 * p), duration: 1.1, ease: "power2.out", immediateRender: false }, t + 0.7);
        // Compteur sans callback (seek-safe) : tween de textContent entier, puis « 9,6 % » exact en fondu.
        tl.fromTo("#n" + k, { textContent: 0 }, { textContent: Math.round(p * 100), duration: 1.1, ease: "power2.out", snap: { textContent: 1 }, immediateRender: false }, t + 0.7);
      }
      tl.fromTo("#p2 .live", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 4.9);
      tl.fromTo("#x2", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 4.9);
      tl.fromTo("#p3", { scale: 1 }, { keyframes: { scale: [1, 1.12, 1] }, duration: 0.6, ease: "none", transformOrigin: "0 50%", immediateRender: false }, 7.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
