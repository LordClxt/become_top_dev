checks:
- id: journal
  label: L'application journalise ses écritures dans le WAL
  rule: edge_kind
  source: app
  target: wal
  kind: write
- id: nodirect
  label: 'L''application ne fait que lire les pages : jamais d''écriture directe'
  rule: edge_kind
  source: app
  target: page
  kind: read
- id: apply
  label: Le journal est appliqué aux pages
  rule: edge_kind
  source: wal
  target: page
  kind: write
- id: recover
  label: La reprise relit le journal
  rule: edge_kind
  source: recovery
  target: wal
  kind: read
- id: replay
  label: La reprise réapplique les pages
  rule: edge_kind
  source: recovery
  target: page
  kind: write
- id: durable-wal
  label: Le journal vit sur le disque durable
  rule: in_zone
  source: wal
  target: disk
- id: durable-page
  label: Les pages vivent sur le disque durable
  rule: in_zone
  source: page
  target: disk
- id: one-wal
  label: Un seul journal
  rule: count
  source: wal
  min: 1
  max: 1
- id: no-volatile
  label: Pas de cache volatile devant les pages
  rule: count
  source: redis
  max: 0
- id: no-memtable
  label: 'Pas de memtable : ceci est un B-tree, pas un LSM-tree'
  rule: count
  source: memtable
  max: 0
- id: shape
  label: 'Après 4 insertions (10, 20, 30, 40) avec 3 clés par page : une racine « 30 » et deux feuilles'
  rule: tree_shape
  source: page
  tree:
    keys: '30'
    children:
    - keys: 10 20
    - keys: 30 40
- id: alone
  label: Aucun bloc isolé
  rule: connected
