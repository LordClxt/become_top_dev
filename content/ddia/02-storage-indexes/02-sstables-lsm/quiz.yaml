id: ddia-ch02-l02-quiz
questions:
- id: q1
  type: single
  prompt: Qu'est-ce qui distingue une SSTable d'un segment de log simple ?
  choices:
  - Les paires sont triées par clé et chaque clé n'apparaît qu'une fois
  - Elle est compressée
  - Elle est stockée en mémoire
  - Elle contient des pierres tombales
  answer: 0
  explanation: 'Deux exigences : tri par clé, et une seule entrée par clé (assurée par la compaction).'
  concept: ddia-sstable
  difficulty: 1
- id: q2
  type: single
  prompt: Comment fusionne-t-on des SSTables ?
  choices:
  - 'Comme un mergesort : on lit les fichiers côte à côte et on copie la plus petite clé'
  - On les concatène puis on trie en mémoire
  - On supprime les plus anciens
  - On les recopie dans un B-tree
  answer: 0
  explanation: Ça marche même si les fichiers sont plus gros que la mémoire.
  concept: ddia-merge-sorted
  difficulty: 1
- id: q3
  type: single
  prompt: Quand une clé figure dans plusieurs segments à fusionner, laquelle garde-t-on ?
  choices:
  - La valeur du segment le plus récent
  - La plus ancienne
  - La plus grande
  - 'Aucune : on l''élimine'
  answer: 0
  explanation: Chaque segment contient les écritures d'une période ; le plus récent est le plus à jour.
  concept: ddia-merge-sorted
  difficulty: 1
- id: q4
  type: code-output
  prompt: Qu'affiche ce programme ? (fusion de deux segments, le plus récent écrase)
  code: |
    old := map[string]string{"a": "1", "b": "1"}
    newer := map[string]string{"b": "2", "c": "2"}
    for k, v := range newer {
        old[k] = v
    }
    keys := []string{}
    for k := range old {
        keys = append(keys, k)
    }
    sort.Strings(keys)
    fmt.Println(keys, old["b"])
  answer: '[a b c] 2'
  explanation: La clé b vient du segment récent. L'ordre trié de la sortie est ce qui fait de la fusion une SSTable valide.
  concept: ddia-merge-sorted
  difficulty: 2
- id: q5
  type: single
  prompt: Pourquoi un index creux (sparse) suffit-il pour une SSTable ?
  choices:
  - Les clés étant triées, on saute à la clé indexée la plus proche et on balaie quelques Ko
  - Parce que les clés sont toutes de la même taille
  - Parce qu'on utilise un filtre de Bloom
  - Parce que le fichier est compressé
  answer: 0
  explanation: 'Pour trouver handiwork, on connaît handbag et handsome : on saute à handbag et on balaie.'
  concept: ddia-sparse-index
  difficulty: 2
- id: q6
  type: single
  prompt: Comment obtient-on des données triées alors que les écritures arrivent dans le désordre ?
  choices:
  - On les insère d'abord dans un arbre équilibré en mémoire (memtable), qu'on écrit sur disque au seuil
  - On trie le disque à chaque écriture
  - On refuse les écritures désordonnées
  - On utilise un index de hachage
  answer: 0
  explanation: Maintenir un ordre trié est facile en mémoire (arbre rouge-noir ou AVL), difficile sur disque.
  concept: ddia-memtable-wal
  difficulty: 1
- id: q7
  type: single
  prompt: À quoi sert le journal (WAL) d'un moteur LSM ?
  choices:
  - À restaurer la memtable après un crash ; on le jette quand la memtable est écrite en SSTable
  - À accélérer les lectures
  - À compacter les segments
  - À remplacer les SSTables
  answer: 0
  explanation: 'Son ordre n''importe pas : c''est une simple trace des écritures récentes.'
  concept: ddia-memtable-wal
  difficulty: 1
- id: q8
  type: single
  prompt: Dans quel ordre une lecture consulte-t-elle un LSM-tree ?
  choices:
  - Memtable, puis segment le plus récent, puis les plus anciens
  - Segments anciens puis memtable
  - Uniquement la memtable
  - Index de hachage puis disque
  answer: 0
  explanation: 'Plus récent = plus à jour : on s''arrête à la première occurrence.'
  concept: ddia-lsm-tree
  difficulty: 1
- id: q9
  type: single
  prompt: Que garantit un filtre de Bloom ?
  choices:
  - Qu'une clé jugée absente l'est sûrement, mais une clé jugée présente peut ne pas l'être
  - Qu'une clé jugée présente l'est sûrement
  - Qu'il n'y a ni faux positifs ni faux négatifs
  - Qu'il accélère la compaction
  answer: 0
  explanation: 'Zéro faux négatif : il économise les lectures de segments pour les clés inexistantes.'
  concept: ddia-bloom-filter
  difficulty: 2
- id: q10
  type: single
  prompt: Pourquoi les clés inexistantes sont-elles coûteuses dans un LSM-tree ?
  choices:
  - Il faut consulter la memtable et tous les segments jusqu'au plus ancien avant d'être sûr de l'absence
  - Parce qu'elles sont invalides
  - Parce qu'elles déclenchent une compaction
  - Parce qu'elles occupent le WAL
  answer: 0
  explanation: D'où l'ajout d'un filtre de Bloom en mémoire.
  concept: ddia-bloom-filter
  difficulty: 2
- id: q11
  type: single
  prompt: Quelle différence entre compaction size-tiered et leveled ?
  choices:
  - Size-tiered fusionne des SSTables petites dans des plus grosses ; leveled découpe l'espace de clés en petites SSTables rangées par niveaux
  - Size-tiered est réservée à Cassandra
  - Leveled ne compacte jamais
  - Il n'y en a aucune
  answer: 0
  explanation: Leveled rend la compaction plus incrémentale et utilise moins d'espace.
  concept: ddia-compaction-strategies
  difficulty: 2
- id: q12
  type: single
  prompt: Quel moteur utilise des SSTables et une memtable sans être une base clé-valeur classique ?
  choices:
  - Lucene, pour son dictionnaire de termes (terme → liste de documents)
  - Redis
  - Memcached
  - Aucun
  answer: 0
  explanation: Lucene range term → postings list dans des fichiers triés de type SSTable, fusionnés en arrière-plan.
  concept: ddia-lsm-tree
  difficulty: 3
