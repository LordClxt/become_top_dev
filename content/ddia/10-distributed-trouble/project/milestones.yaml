milestones:
- id: m1
  title: Détecter une panne
  goal: Un détecteur dont le timeout vaut moyenne + k écarts-types des intervalles récents (fenêtre glissante, jamais sous un minimum) et qui
    soupçonne un nœud silencieux.
  tests: "tstest M1"
  review: false
- id: m2
  title: Horloges et ordre
  goal: Une horloge de Lamport, un LWW qui départage les égalités, des intervalles de confiance façon TrueTime et un commit-wait.
  tests: "tstest M2"
  review: false
- id: m3
  title: Baux et jetons de clôture
  goal: Un service de baux à jetons croissants, un stockage qui rejette les jetons périmés, une majorité et une vérification des propriétés de
    sûreté.
  tests: "tstest M3"
  review: true
  prompt: Ton `FencedStorage` protège-t-il contre un client qui ment sur son jeton ? Et pourquoi la vérification doit-elle se faire côté stockage
    et non côté client ?
