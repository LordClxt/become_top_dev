id: ddia-ch10-project
title: Tinybase — survivre aux pannes partielles
pitch: 'Tinybase apprend à douter : un détecteur de pannes à timeout adaptatif, des horloges logiques et des intervalles façon TrueTime, puis
  un service de baux avec jetons de clôture qui empêche un client en pause de corrompre les données.'
running_project: tinybase
kind: code
language: go
difficulty: 5
xp: 280
timeout_s: 90
entrypoint: starter/
test_command: go test ./...
files_editable:
- trouble.go
concepts:
- ddia-adaptive-timeout
- ddia-fault-detection
- ddia-logical-clocks
- ddia-lww-timestamps
- ddia-clock-confidence-interval
- ddia-commit-wait
- ddia-fencing-token
- ddia-majority-truth
milestones:
- id: m1
  title: Détecter une panne
  goal: Un détecteur dont le timeout vaut moyenne + k écarts-types des intervalles récents (fenêtre glissante, jamais sous un minimum) et qui
    soupçonne un nœud silencieux.
  tests: go test ./... -run TestM1
  review: false
- id: m2
  title: Horloges et ordre
  goal: Une horloge de Lamport, un LWW qui départage les égalités, des intervalles de confiance façon TrueTime et un commit-wait.
  tests: go test ./... -run TestM2
  review: false
- id: m3
  title: Baux et jetons de clôture
  goal: Un service de baux à jetons croissants, un stockage qui rejette les jetons périmés, une majorité et une vérification des propriétés de
    sûreté.
  tests: go test ./... -run TestM3
  review: true
  prompt: Ton FencedStorage protège-t-il contre un client qui ment sur son jeton ? Et pourquoi la vérification doit-elle se faire côté stockage
    et non côté client ?
verified: { at: 2026-10-11, solution: pass, starter: fail }
