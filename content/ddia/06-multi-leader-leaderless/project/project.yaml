id: ddia-ch06-project
title: 'Tinybase — sans leader : versions, siblings et quorums'
pitch: 'Tinybase accepte maintenant des écritures concurrentes : des vecteurs de version pour savoir qui précède qui, un serveur de siblings pour
  ne rien perdre, et un cluster à quorum qui se répare à la lecture.'
running_project: tinybase
kind: code
language: go
difficulty: 4
xp: 260
timeout_s: 60
entrypoint: starter/
test_command: go test ./...
files_editable:
- leaderless.go
concepts:
- ddia-version-vector
- ddia-siblings
- ddia-quorum
- ddia-read-repair
- ddia-anti-entropy
milestones:
- id: m1
  title: Vecteurs de version et compteur convergent
  goal: Comparer deux vecteurs (avant, après, égaux, concurrents), incrémenter sans muter, fusionner (maximum par réplica) et sommer un G-Counter.
  tests: go test ./... -run TestM1
  review: false
- id: m2
  title: Le serveur de siblings
  goal: 'Rejouer l''algorithme du panier : numéro de version par clé, valeurs concurrentes conservées, valeurs fusionnées écrasées ; fusionner
    des paniers avec tombstones.'
  tests: go test ./... -run TestM2
  review: false
- id: m3
  title: Un cluster à quorum
  goal: Écrire sur les nœuds en marche et exiger w confirmations, lire r réponses avec réparation à la lecture, constater qu'une écriture échouée
    n'est pas annulée, et converger par anti-entropie.
  tests: go test ./... -run TestM3
  review: true
  prompt: Pourquoi ce cluster peut-il renvoyer une valeur périmée même quand w + r > n, et quelles garanties du module précédent (lire ses écritures,
    lectures monotones) n'offre-t-il pas ?
verified: { at: 2026-10-11, solution: pass, starter: fail }
