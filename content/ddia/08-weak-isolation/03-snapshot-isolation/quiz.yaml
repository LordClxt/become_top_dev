id: ddia-ch08-l03-quiz
questions:
- id: q1
  type: single
  prompt: Alice voit 500 € sur un compte avant un virement et 400 € sur l'autre après. Quelle anomalie ?
  choices:
  - Une lecture non répétable (read skew)
  - Une lecture sale
  - Une écriture sale
  - Un write skew
  answer: 0
  explanation: Elle voit 900 € au lieu de 1 000.
  concept: ddia-read-skew
  difficulty: 1
- id: q2
  type: single
  prompt: Pourquoi le read skew est-il inacceptable pour une sauvegarde ?
  choices:
  - Les incohérences sont restaurées et deviennent permanentes
  - La sauvegarde est trop lente
  - Elle bloque les écritures
  - Elle double la taille
  answer: 0
  explanation: La copie dure des heures pendant lesquelles les données changent.
  concept: ddia-read-skew
  difficulty: 1
- id: q3
  type: single
  prompt: Quelle est la garantie de l'isolation par instantané ?
  choices:
  - Chaque transaction voit les données validées au moment où elle a démarré
  - Chaque lecture voit les dernières données
  - Aucune écriture concurrente n'est possible
  - Les lectures prennent un verrou
  answer: 0
  explanation: Même si les données changent ensuite.
  concept: ddia-snapshot-isolation
  difficulty: 1
- id: q4
  type: single
  prompt: 'Principe clé en performance de l''isolation par instantané :'
  choices:
  - Les lecteurs ne bloquent jamais les écrivains, et inversement
  - Les lecteurs bloquent les écrivains
  - Seuls les écrivains attendent
  - Tout est sérialisé
  answer: 0
  explanation: Pas de verrous de lecture.
  concept: ddia-snapshot-isolation
  difficulty: 1
- id: q5
  type: single
  prompt: Que signifie MVCC ?
  choices:
  - 'Contrôle de concurrence multi-versions : plusieurs versions d''un objet coexistent'
  - Un format de log
  - Une méthode de partitionnement
  - Un protocole réseau
  answer: 0
  explanation: Chaque version porte created_by et deleted_by.
  concept: ddia-mvcc
  difficulty: 1
- id: q6
  type: single
  prompt: Dans MVCC, que devient une ligne « supprimée » ?
  choices:
  - Elle est marquée avec deleted_by et supprimée plus tard par le ramasse-miettes
  - Elle disparaît immédiatement
  - Elle est déplacée
  - Elle est chiffrée
  answer: 0
  explanation: Une mise à jour = suppression + création.
  concept: ddia-mvcc
  difficulty: 1
- id: q7
  type: single
  prompt: Quelle écriture un lecteur ignore-t-il ?
  choices:
  - Celles des transactions en cours au début de la sienne, des annulées, et des démarrées plus tard
  - Celles des transactions validées avant
  - Les siennes
  - Aucune
  answer: 0
  explanation: Les quatre règles de visibilité.
  concept: ddia-visibility-rules
  difficulty: 1
- id: q8
  type: single
  prompt: La transaction 12 lit le compte 2 alors que la 13 (démarrée après) a mis le solde à 400 et validé. Que voit la 12 ?
  choices:
  - '500 : les écritures d''une transaction plus tardive sont ignorées'
  - '400'
  - Une erreur
  - '0'
  answer: 0
  explanation: Règle 3.
  concept: ddia-visibility-rules
  difficulty: 1
- id: q9
  type: single
  prompt: Quel est le risque d'une transaction très longue en MVCC ?
  choices:
  - Elle retarde le nettoyage des anciennes versions
  - Elle bloque les lecteurs
  - Elle verrouille toutes les lignes
  - Aucun
  answer: 0
  explanation: Elle peut avoir encore besoin de ces versions.
  concept: ddia-mvcc
  difficulty: 2
- id: q10
  type: single
  prompt: Que veut dire « repeatable read » dans PostgreSQL ?
  choices:
  - De l'isolation par instantané
  - Une sérialisabilité stricte
  - Une lecture sale
  - Un cache
  answer: 0
  explanation: Le nom vient de la norme SQL, dont la définition est ambiguë.
  concept: ddia-repeatable-read-naming
  difficulty: 1
