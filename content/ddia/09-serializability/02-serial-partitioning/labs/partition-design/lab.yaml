  hint: Ré-exécute les mêmes procédures déterministes, dans le même ordre.
- type: coord
  component: service
  label: Coordinateur multi-partitions
  hint: Exécute en lock-step une transaction qui touche plusieurs partitions.
- type: reports
  component: worker
  label: Rapports analytiques
  hint: Longues lectures, en lecture seule.
- type: biglock
  component: postgres
  label: Base unique sous verrou global
  hint: Toutes les transactions derrière un seul verrou.
- type: disk
  component: disk
  label: Lecture disque en pleine transaction
  hint: Aller chercher une donnée froide pendant que le thread attend.
- type: session
  component: external
  label: Session interactive
  hint: L'utilisateur garde la transaction ouverte entre deux clics.
