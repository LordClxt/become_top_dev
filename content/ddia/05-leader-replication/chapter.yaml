  pages: 151-167
objectives:
- Expliquer la réplication par leader et chiffrer le compromis entre réplication synchrone, semi-synchrone et asynchrone
- Dérouler la mise en place d'un follower et un failover, et nommer ce qui peut mal tourner (écritures perdues, clés réutilisées, split brain,
  timeout)
- Comparer les quatre formats de log de réplication (instructions, WAL, logique, triggers) et dire lequel autorise une mise à jour sans interruption
- 'Reconnaître les anomalies dues au retard de réplication et choisir la garantie qui les corrige : lire ses écritures, lectures monotones, préfixe
  cohérent'
